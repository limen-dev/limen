<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 480" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Limen self-hosted architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
<rect width="1220" height="480" fill="#ffffff"/>
<rect x="20" y="40" width="240" height="300" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="32" y="60" font-weight="bold" fill="#334155">Laptop</text>
<rect x="340" y="40" width="480" height="420" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="352" y="60" font-weight="bold" fill="#334155">Limen VPC (private subnets, 2+ AZs)</text>
<rect x="900" y="40" width="300" height="420" rx="10" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/><text x="912" y="60" font-weight="bold" fill="#334155">Target VPC / cluster (egress only)</text>
