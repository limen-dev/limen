<text x="1050.0" y="201" text-anchor="middle" fill="#0f172a" font-weight="bold">Worker x N</text>
<text x="1050.0" y="217" text-anchor="middle" fill="#0f172a">protocols, recording</text>
<rect x="920" y="300" width="260" height="80" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="1050.0" y="336" text-anchor="middle" fill="#0f172a" font-weight="bold">SSH, databases, caches, search,</text>
<text x="1050.0" y="352" text-anchor="middle" fill="#0f172a">brokers, Kubernetes, web apps, TCP</text>
