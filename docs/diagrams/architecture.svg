<line x1="717" y1="240" x2="746" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="920" y1="179" x2="679" y2="130" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="799" y="149" text-anchor="middle" font-size="11" fill="#334155" stroke="#fff" stroke-width="3" paint-order="stroke">outbound mTLS tunnel</text>
