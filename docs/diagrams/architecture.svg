<line x1="650" y1="240" x2="563" y2="300" stroke="#334155" stroke-width="1.5" marker-end="url(#a)"/>
<text x="607" y="265" text-anchor="middle" font-size="11" fill="#334155" stroke="#fff" stroke-width="3" paint-order="stroke">sign</text>
