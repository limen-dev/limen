[package]
name = "limen-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
limen-control-plane = { path = "../crates/limen-control-plane" }
limen-policy = { path = "../crates/limen-policy" }
limen-proxy = { path = "../crates/limen-proxy" }
limen-worker = { path = "../crates/limen-worker" }
time = "0.3"
tokio = { version = "1", features = ["rt"] }

# Not part of the main workspace: it needs nightly, and its dependencies are built with
# sanitizer flags (fuzz/README.md).
[workspace]

[[bin]]
name = "redis_frames"
path = "fuzz_targets/redis_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mongo_wire"
path = "fuzz_targets/mongo_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "amqp_frames"
