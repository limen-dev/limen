# Everything the project needs besides a container runtime (Docker or OrbStack,
# which mise cannot install). `mise install` fetches all of it.
[tools]
# Build and lint
rust = { version = "1.99.0", components = "rustfmt,clippy" }
protoc = "36.2"
cargo-deny = "0.20.2"
"cargo:cargo-audit" = "0.22.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Secret scan of the working tree and the whole git history (.gitleaksignore, secret-scan.yml)
gitleaks = "8.30.1"
# Dev stack, demos and scripts (deploy/compose/setup.sh, demos/)
python = "3.13"
kind = "0.33.0"
kubectl = "1.35.4"
# Releases and infrastructure
gh = "2.102.0"
terraform = "1.16.6"
helm = "4.2.0"
# Reference docs generated from the chart and the Terraform modules (infra.yml checks they are current)
helm-docs = "1.14.2"
terraform-docs = "0.24.0"
# Strict schema check of the rendered Helm chart (infra.yml)
kubeconform = "0.8.0"
# Protobuf lint and breaking-change check for the management API (proto/buf.yaml)
buf = "1.74.0"
# Documentation site and homepage (website/)
node = "24.22.1"

[tasks.website-deps]
description = "Install website/ dependencies with npm ci, again only when package-lock.json changes"
dir = "website"
sources = ["package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks.website]
description = "Run the documentation site and homepage in dev mode"
dir = "website"
depends = ["website-deps"]
raw = true
run = "npm run dev"

[tasks.stack]
description = "Deploy the local Limen dev stack (deploy/compose/setup.sh); flags after -- go to setup.sh, e.g. -- --yes --stacks ssh"
raw = true
run = "deploy/compose/setup.sh"

[tasks.install-cli]
description = "Build the limen CLI from this checkout and install it to ~/.local/bin (set PREFIX to change)"
run = "scripts/install-cli.sh"

[tasks.stack-down]
description = "Take down the local dev stack and delete its volumes (setup.sh down -v: data and dev CA state are lost)"
raw = true
run = "deploy/compose/setup.sh down"

[tasks.stack-status]
description = "Show which containers of the local dev stack are running (setup.sh status)"
raw = true
run = "deploy/compose/setup.sh status"

[tasks.check]
description = "Format check and clippy with warnings as errors, the checks every change needs"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
]

[tasks.test]
description = "Run the workspace tests. Integration tests need the stack's postgres, kms and s3 services (see CONTRIBUTING.md)"
run = "cargo test --workspace --locked"

[tasks.gen]
description = "Regenerate the generated files: CLI reference, Grafana dashboards and alerts, dev users. CI fails when they are stale"
run = [
  "scripts/gen-cli-reference.sh",
  "python3 deploy/grafana/generate.py",
  "python3 deploy/compose/scripts/gen-dev-users.py",
]

[tasks.website-build]
description = "Build the website and run its link and site checks (the whole check before pushing a site or docs change)"
dir = "website"
depends = ["website-deps"]
raw = true
run = "npm run build"
