<label><span>From (UTC)</span><span class="dp"><input type="text" name="from" value="{{ filter.from }}" placeholder="YYYY-MM-DD" autocomplete="off" inputmode="numeric" maxlength="20" data-datepicker><button type="button" class="dp-btn" aria-label="Choose a start date"><svg class="i"><use href="/console/static/icons.svg?v={{ chrome.assets }}#calendar"/></svg></button></span></label>
<label><span>To (UTC)</span><span class="dp"><input type="text" name="to" value="{{ filter.to }}" placeholder="YYYY-MM-DD" autocomplete="off" inputmode="numeric" maxlength="20" data-datepicker><button type="button" class="dp-btn" aria-label="Choose an end date"><svg class="i"><use href="/console/static/icons.svg?v={{ chrome.assets }}#calendar"/></svg></button></span></label>
