<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>Sign in · Limen</title>
<link rel="icon" href="/console/static/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/console/static/console.css?v={{ assets }}">
<script src="/console/static/console.js?v={{ assets }}"></script>
</head>
<body class="plain">
<main class="card msg signin">
  <img class="logo-light" src="/console/static/logo-mark.svg" alt="" width="56" height="56">
  <img class="logo-dark" src="/console/static/logo-mark-dark.svg" alt="" width="56" height="56">
  <h1>Sign in to Limen</h1>
  <p>Use your organization's identity provider. Access is short-lived, and every action is audited.</p>
  <a class="button wide" href="/console/login"><svg class="i"><use href="/console/static/icons.svg#key-round"/></svg>Continue with single sign-on</a>
  <div class="signin-foot">
    <span>Limen {{ version }}</span>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" class="secondary" data-theme-set="system" aria-pressed="false" title="Match the system"><svg class="i"><use href="/console/static/icons.svg#monitor"/></svg></button>
      <button type="button" class="secondary" data-theme-set="light" aria-pressed="false" title="Light"><svg class="i"><use href="/console/static/icons.svg#sun"/></svg></button>
      <button type="button" class="secondary" data-theme-set="dark" aria-pressed="false" title="Dark"><svg class="i"><use href="/console/static/icons.svg#moon"/></svg></button>
    </div>
  </div>
</main>
</body>
</html>
