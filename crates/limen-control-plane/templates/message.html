<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="darkreader-lock">
<title>{{ title }} · Limen</title>
<link rel="icon" href="/console/static/logo-mark.svg?v={{ assets }}" type="image/svg+xml">
<link rel="stylesheet" href="/console/static/console.css?v={{ assets }}">
<script src="/console/static/console.js?v={{ assets }}"></script>
</head>
<body class="plain">
<main class="card msg">
  <img class="logo-light" src="/console/static/logo-mark.svg?v={{ assets }}" alt="Limen" width="48" height="48">
  <img class="logo-dark" src="/console/static/logo-mark-dark.svg?v={{ assets }}" alt="Limen" width="48" height="48">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="button" href="/console/">Open the console</a>
</main>
</body>
</html>
