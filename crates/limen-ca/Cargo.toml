[package]
name = "limen-ca"
description = "Limen certificate authority: X.509 and SSH certificate issuance."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# AWS KMS-backed signer. Only the control plane enables this.
kms = ["dep:aws-sdk-kms", "dep:sha2"]

[dependencies]
limen-core.workspace = true
futures.workspace = true
metrics.workspace = true
rcgen.workspace = true
rustls-pki-types.workspace = true
rand.workspace = true
ssh-key.workspace = true
signature.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true
webpki.workspace = true
x509-parser.workspace = true
sha2 = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }

[dev-dependencies]
limen-testkit.workspace = true
rcgen.workspace = true
rand.workspace = true
ssh-key.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[[test]]
name = "kms"
required-features = ["kms"]

[lints]
workspace = true
