name: Bug
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands and the demo script or compose stack you used. Do not paste tokens, keys, or certificates.
  - type: input
    id: version
    attributes:
      label: Version or commit
