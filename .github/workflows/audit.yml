name: audit

# cargo-deny and cargo-audit. Also runs on weekdays: advisories appear without a commit.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).
# Started by ci.yml when manifests, the lock file or the deny config change.

on:
  # Also called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # Weekdays too: advisories appear without a commit.
  schedule:
    - cron: "17 5 * * 1-5"
  # A manual run runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: audit-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit (cargo-deny, cargo-audit)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny and cargo-audit
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: rust cargo-deny cargo:cargo-audit

      - name: Licenses, bans and sources (cargo deny)
        run: cargo deny --locked check

      - name: Known vulnerabilities (cargo audit)
        run: cargo audit
