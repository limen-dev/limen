name: ci-workflows

# actionlint on the workflows.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).
# Started by ci.yml when a workflow changes.

on:
  # Also called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # A manual run runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: ci-workflows-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # actionlint runs shellcheck on `run:` scripts when it is installed.
          install_args: actionlint shellcheck

      - name: Lint the workflows
        run: actionlint

      # The rules that decide which areas ci.yml runs for a change.
      - name: Test the area rules (scripts/ci-changes.sh)
        run: |
          shellcheck scripts/ci-changes.sh scripts/test-ci-changes.sh
          scripts/test-ci-changes.sh
