name: website-browsers

# The built site in Chromium, WebKit and Firefox at phone, tablet and desktop sizes:
# overflow, JS errors, third-party requests, axe WCAG A/AA, touch targets.
# Slow, so it never runs on a push or pull request: only weekly, or by hand
# (gh workflow run website-browsers.yml).

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-browsers
  cancel-in-progress: false

jobs:
  matrix:
    name: Browser matrix (${{ matrix.theme }} theme)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node

      - name: Build the site
        working-directory: website
        run: |
          npm ci
          npm run build

      # The script resolves Playwright and axe from the directory it runs in, so they
      # are installed in a scratch directory instead of becoming site dependencies.
      - name: Install the browsers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browsers" && cd "$RUNNER_TEMP/browsers"
          npm init -y >/dev/null
          npm i playwright-core@1.64.1 axe-core@4.14.0
          npx playwright-core install --with-deps chromium webkit firefox

      - name: Serve the site
        working-directory: website
        run: |
          nohup npx astro preview --port 4341 > "$RUNNER_TEMP/preview.log" 2>&1 &
          curl --silent --fail --retry 30 --retry-delay 1 --retry-connrefused http://localhost:4341/ >/dev/null

      # Exit 1: a finding. Exit 2: an engine did not start, so it tested nothing.
      - name: Run the matrix
        working-directory: ${{ runner.temp }}/browsers
        env:
          SITE_URL: http://localhost:4341
          THEME: ${{ matrix.theme }}
        run: node "$GITHUB_WORKSPACE/website/scripts/browser-matrix.mjs"
