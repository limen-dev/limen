name: deploy-website

# Publishes website/ to GitHub Pages (https://limen-dev.github.io/limen) from main.
# Does nothing until the repository variable PUBLISH_SITE is "true": Pages from a private
# repository needs a paid plan, so turn it on when the repository goes public, with Pages
# set to "GitHub Actions" (docs/runbooks/website-publishing.md).

on:
  push:
    branches: [main]
    # The build publishes docs/ and the compose README into the site.
    paths:
      - "website/**"
      - "docs/**"
      - "deploy/compose/README.md"
      - "mise.toml"
      - ".github/workflows/deploy-website.yml"
  # A manual run ignores the path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy that has started.
  cancel-in-progress: false

env:
  # A project site is served under /<repo>/. For a custom domain set SITE_URL to it and SITE_BASE to "/".
  SITE_URL: ${{ vars.SITE_URL || 'https://limen-dev.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/limen' }}

jobs:
  build:
    name: Build the site
    if: vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node

      - name: Install the dependencies
        working-directory: website
        run: npm ci

      # The same build and checks as ci-website.yml: broken links, third-party requests, ADR-0031 claims.
      - name: Build and check the site
        working-directory: website
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
