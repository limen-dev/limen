name: ci-rust

# Lint, tests on three platforms, container images. Tests and images wait for lint.
# Starts for any change except docs, the website, demos, Terraform and dashboards.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
    # Everything runs the tests except what is listed here, so a new directory
    # is tested by default. (examples/ stays in: the policy tests read it.)
    paths: &paths
      - "**"
      - "!docs/**"
      - "!website/**"
      - "!demos/**"
      - "!assets/**"
      - "!deploy/terraform/**"
      - "!deploy/grafana/**"
      - "!**.md"
      - "!LICENSE"
      - "!.github/**"
      - ".github/workflows/ci-rust.yml"
  # A draft pull request runs nothing; marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  # Called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # A manual run ignores the path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: ci-rust-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt, clippy, image versions)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc

      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main saves the cache; saving cost pull requests over a minute per job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Image versions agree with deploy/compose/.env
        run: scripts/check-versions.sh

      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # The management API is a compatibility promise (ADR-0042): buf lints it and
  # refuses breaking changes against the base. Before 1.0, a break the owner
  # accepted goes through with the api-breaking-approved label and an upgrade
  # note (ADR-0024). Adding the label doesn't start a run: re-run this job.
  api-contract:
    name: Management API contract (buf)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The breaking check reads the base commit from history.
          fetch-depth: 0

      - name: Install buf
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: buf

      - name: Lint and formatting
        working-directory: proto
        run: |
          buf lint
          buf format --diff --exit-code

      - name: No breaking changes
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           !contains(github.event.pull_request.labels.*.name, 'api-breaking-approved'))
        working-directory: proto
        env:
          # The pull request's base, or the previous main commit on a push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a force push has no usable base; lint still ran.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; skipping the breaking check."
            exit 0
          fi
          buf breaking --against "$(git rev-parse --git-common-dir)#ref=$BASE,subdir=proto"

  # Linux runs the integration tests too, against PostgreSQL and a KMS emulator.
  test-linux:
    name: Tests (Linux ${{ matrix.arch }})
    needs: lint
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: limen
          POSTGRES_PASSWORD: limen-ci
          POSTGRES_DB: limen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U limen -d limen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      kms:
        image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
        ports: ["8099:8080"]

      # Receives the span the otlp_collector test sends (OTLP over HTTP on 4318).
      jaeger:
        image: jaegertracing/jaeger:2.22.0
        ports: ["4318:4318"]
    env:
      # No debug info: with it the x86 runner ran out of disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # Hosted runners are small: more parallel compiles can run out of memory.
      CARGO_BUILD_JOBS: "2"
      # Show the components' warnings in the log when a test fails.
      LIMEN_TEST_LOG: "1"
      RUST_LOG: warn
      LIMEN_TEST_DATABASE_URL: postgres://limen:limen-ci@localhost:5432/limen
      LIMEN_TEST_KMS_ENDPOINT: http://localhost:8099
      LIMEN_TEST_S3_ENDPOINT: http://localhost:8333
      LIMEN_TEST_OTLP_ENDPOINT: http://localhost:4318
      # The test identity in deploy/compose/config/s3/s3.json.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      # Hosted runners are short on disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not a service container: it needs a command and a mounted config file.
      - name: Start SeaweedFS (S3)
        run: >-
          . deploy/compose/.env;
          docker run -d --name s3 -p 8333:8333
          -v "$GITHUB_WORKSPACE/deploy/compose/config/s3/s3.json:/etc/seaweedfs/s3.json:ro"
          "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=512

      # Exports the LIMEN_TEST_*_TARGET, _CA_FILE and _CLIENT_PEM variables for the test step.
      - name: Start the database targets (PostgreSQL, MySQL, MongoDB)
        run: scripts/ci-db-targets.sh start

      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc

      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run all tests (a skipped integration test fails the job)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee test.log
          if grep -q '^SKIPPED:' test.log; then grep '^SKIPPED:' test.log; exit 1; fi

  # No containers on macOS, so integration tests skip (they print SKIPPED) and only unit tests run.
  # Not on pull requests: macOS minutes cost 10x on a private repository. Runs on main and releases.
  test-macos:
    name: Tests (macOS, unit only)
    needs: lint
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc

      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run all tests
        run: cargo test --workspace --all-features --locked

  # One job for the three images: they share the builder stage's layers.
  images:
    name: Container images
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The Dockerfile needs BuildKit.
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build each image and run it with --version
        run: |
          set -euo pipefail
          . deploy/compose/.env   # the Dockerfile has no default base images
          for target in control-plane proxy worker; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg DISTROLESS_IMAGE="$DISTROLESS_IMAGE" \
              -t "limen-${target}:ci" .
            docker run --rm "limen-${target}:ci" --version
          done
