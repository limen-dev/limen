name: infra

# Terraform, generated dashboards, dev users. crates/ counts: dashboards come from metric names.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
    # Only these start it: add a path here when a check reads a new file (files the checks read).
    paths: &paths
      - "deploy/terraform/**"
      - "deploy/helm/**"
      - "deploy/grafana/**"
      - "deploy/compose/config/dev-users.toml"
      - "deploy/compose/scripts/gen-dev-users.py"
      # gen-dev-users.py reads the mappings and writes these blocks; lib.sh is the policy-selection test's subject.
      - "examples/policy/**"
      - "deploy/compose/config/dex/config.yaml"
      - "deploy/compose/README.md"
      - "deploy/compose/scripts/dev-users.sh"
      - "deploy/compose/scripts/lib.sh"
      - "deploy/compose/scripts/test-policy-selection.sh"
      - "crates/**"
      - ".github/workflows/infra.yml"
  # A draft pull request runs nothing; marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  # Called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # A manual run ignores the path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: infra-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    name: Terraform, dashboards, dev users
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: terraform helm kubeconform terraform-docs helm-docs

      - name: Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform

      - name: Terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/modules/foundation deploy/terraform/modules/discovery deploy/terraform/modules/ecs deploy/terraform/modules/ec2 deploy/terraform/examples/audit deploy/terraform/examples/complete deploy/terraform/examples/kubernetes; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      # Plans the audit, ECS and EC2 modules with a mocked AWS provider: `validate` cannot see an
      # expression that fails only for one component (a worker has no service port).
      - name: Terraform plan tests (mocked provider)
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/ecs deploy/terraform/modules/ec2; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" test
          done

      - name: Helm lint and template
        run: |
          helm lint deploy/helm/limen -f deploy/helm/limen/ci-values.yaml
          helm template limen deploy/helm/limen -f deploy/helm/limen/ci-values.yaml > /dev/null

      - name: Chart render checks
        run: deploy/helm/limen/tests/render.sh

      # Helm renders any YAML; the Kubernetes schema says whether the API server would accept it.
      - name: Rendered chart matches the Kubernetes schema
        run: helm template limen deploy/helm/limen -f deploy/helm/limen/ci-values.yaml | kubeconform -strict -summary -kubernetes-version 1.35.0

      - name: Terraform reference docs are up to date
        run: deploy/terraform/docs.sh --check

      - name: Chart reference docs are up to date
        run: |
          helm-docs --chart-search-root deploy/helm --sort-values-order file
          git diff --exit-code -- deploy/helm

      - name: Generated dashboards and dev users are up to date
        run: mise run gen-check

      - name: Compose stacks pick the right policy directories
        run: bash deploy/compose/scripts/test-policy-selection.sh
