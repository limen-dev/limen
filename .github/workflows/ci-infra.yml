name: ci-infra

# Infrastructure: Terraform, generated dashboards, dev users.
# (crates/ counts too: the dashboards are generated from metric names.)
#
# Where the jobs run is one repository variable, so switching needs no commit:
#   gh variable set CI_RUNNERS --body github-hosted --repo jfcmartins/limen   # GitHub-hosted (uses hosted minutes)
#   gh variable delete CI_RUNNERS --repo jfcmartins/limen                     # back to the self-hosted runners
# Releases always use hosted runners (release.yml passes hosted: true).

on:
  push:
    branches: [main]
    paths:
      - "deploy/terraform/**"
      - "deploy/grafana/**"
      - "deploy/compose/config/dev-users.toml"
      - "deploy/compose/scripts/gen-dev-users.py"
      - "crates/**"
      - ".github/workflows/ci-infra.yml"
  # Pull requests are opened as drafts and run nothing until they are marked
  # ready for review (the ready_for_review type starts the run then).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deploy/terraform/**"
      - "deploy/grafana/**"
      - "deploy/compose/config/dev-users.toml"
      - "deploy/compose/scripts/gen-dev-users.py"
      - "crates/**"
      - ".github/workflows/ci-infra.yml"
  # The release workflow runs this before it builds anything, and dispatches
  # it for the release pull request (whose commits are pushed with the workflow
  # token, which doesn't start workflows by itself).
  workflow_call:
    inputs:
      hosted:
        description: Run on GitHub-hosted runners instead of the self-hosted ones
        type: boolean
        default: false
  # A manual run ignores the path filter and runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when release.yml calls this workflow,
  # so the prefix keeps the callees' groups apart.
  group: ci-infra-${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs. A push to main always runs to the end, so a
  # quick follow-up commit can't hide the result of the one before it.
  # (Do not add concurrency groups to single jobs: they cancelled queued jobs.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    name: Terraform, dashboards, dev users
    # A draft pull request runs nothing.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 15
    steps:
      # GitHub rate limits the actions/checkout download (HTTP 429) when several
      # self-hosted runners fetch it at once, so this fetches with git instead.
      # The token reaches git through the environment and is never written to
      # disk. Every job below repeats this step with `*checkout`.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - name: Install Terraform
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: terraform
      - name: Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform
      - name: Terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/examples/audit; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Generated dashboards are up to date
        run: |
          python3 deploy/grafana/generate.py
          git diff --exit-code -- deploy/grafana
      - name: Dev users file and what is generated from it agree
        run: python3 deploy/compose/scripts/gen-dev-users.py --check
