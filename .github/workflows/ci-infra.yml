name: ci-infra

# Terraform, generated dashboards, dev users. crates/ counts: dashboards come from metric names.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).
# Started by ci.yml when Terraform, dashboards, dev users or crates/ change.

on:
  # Also called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # A manual run runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: ci-infra-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    name: Terraform, dashboards, dev users
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: terraform

      - name: Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform

      - name: Terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/examples/audit; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Generated dashboards are up to date
        run: |
          python3 deploy/grafana/generate.py
          git diff --exit-code -- deploy/grafana

      - name: Dev users file and what is generated from it agree
        run: python3 deploy/compose/scripts/gen-dev-users.py --check
