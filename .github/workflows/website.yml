name: website

# Builds the site and runs its link and rule checks (npm run build). On main it also publishes
# the site to GitHub Pages (https://limen-dev.github.io/limen), once the repository variable
# PUBLISH_SITE is "true" (docs/runbooks/website-publishing.md).
# GitHub-hosted runners (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
    # The build publishes docs/ and the compose README into the site.
    paths: &paths
      - "website/**"
      - "docs/**"
      - "deploy/compose/README.md"
      - "mise.toml"
      - ".github/workflows/website.yml"
  # A draft pull request runs nothing; marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  # A manual run ignores the path filter, and publishes when run on main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A project site is served under /<repo>/. For a custom domain set SITE_URL to it and SITE_BASE to "/".
  SITE_URL: ${{ vars.SITE_URL || 'https://limen-dev.github.io' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/limen' }}

jobs:
  website:
    name: Website build and checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node

      - name: Install the dependencies
        working-directory: website
        run: npm ci

      # Publishes the docs, builds the site, then fails on a broken link or anchor,
      # a third-party request, or a claim ADR-0031 forbids.
      - name: Build and check the site
        working-directory: website
        run: npm run build

      # Only main publishes, and only once PUBLISH_SITE is on.
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_SITE == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLISH_SITE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
