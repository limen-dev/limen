name: website

# Builds the documentation site and homepage (website/, ADR-0021), checks its links,
# and deploys main to GitHub Pages once Pages is switched on:
#   gh variable set PAGES_ENABLED --body true --repo jfcmartins/limen
# (Pages needs the repository to be public, or a paid plan.) Until then the deploy
# job is skipped and this only builds. Moving to a custom domain is two variables:
#   SITE_URL=https://example.com  SITE_BASE=/
# Where the build runs follows the same CI_RUNNERS variable as ci.yml.

on:
  # Pull requests are opened as drafts and run nothing until marked ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &paths
      - website/**
      - docs/**
      - deploy/compose/README.md
      - mise.toml
      - .github/workflows/website.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and check links
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNERS == 'github-hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 15
    env:
      # GitHub Pages serves a project site under /<repo>/. A custom domain serves from /.
      SITE_URL: ${{ vars.SITE_URL || 'https://jfcmartins.github.io' }}
      SITE_BASE: ${{ vars.SITE_BASE || '/limen/' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node comes from mise.toml, like every other tool.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node
      - name: Install
        working-directory: website
        run: npm ci
      - name: Audit
        working-directory: website
        run: npm audit --audit-level=high
      # Syncs docs/ into the site, builds it, then fails on a broken link or anchor
      # and on anything the site must not do (third-party requests, a missing guide).
      - name: Build and check
        working-directory: website
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
