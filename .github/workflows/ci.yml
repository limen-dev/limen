name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Don't depend on how the toolchain was installed or cached.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Integration tests need PostgreSQL and a KMS emulator, which run as
  # service containers on Linux runners.
  test-linux:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: limen
          POSTGRES_PASSWORD: limen-ci
          POSTGRES_DB: limen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U limen -d limen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      kms:
        image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
        ports: ["8099:8080"]
    env:
      # Each integration test links the whole workspace plus the AWS SDK. With
      # debug info the x86 runner's disk filled up ("No space left on device").
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      LIMEN_TEST_DATABASE_URL: postgres://limen:limen-ci@localhost:5432/limen
      LIMEN_TEST_KMS_ENDPOINT: http://localhost:8099
      LIMEN_TEST_S3_ENDPOINT: http://localhost:8333
      # The test identity in deploy/compose/s3/s3.json.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Service containers can't take a command or mount repo files, so S3 starts here.
      - name: Start SeaweedFS (S3)
        run: >-
          docker run -d --name s3 -p 8333:8333
          -v "$GITHUB_WORKSPACE/deploy/compose/s3/s3.json:/etc/seaweedfs/s3.json:ro"
          chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test (and fail if any integration test skipped)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee test.log
          if grep -q '^SKIPPED:' test.log; then grep '^SKIPPED:' test.log; exit 1; fi

  # macOS runners have no service containers, so integration tests skip
  # there (they print SKIPPED). Unit tests still run.
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked

  supply-chain:
    name: cargo-deny + cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: cargo deny --locked check
      - run: cargo audit

  images:
    name: image (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [control-plane, proxy, worker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f deploy/docker/Dockerfile --target "${{ matrix.target }}" -t "limen-${{ matrix.target }}:ci" .
      - name: Smoke test
        run: docker run --rm "limen-${{ matrix.target }}:ci" --version

  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: actionlint

  terraform-and-dashboards:
    name: terraform validate + dashboards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: terraform
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/examples/audit; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Generated dashboards are up to date
        run: |
          python3 dashboards/grafana/generate.py
          git diff --exit-code -- dashboards/grafana
