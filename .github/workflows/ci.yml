name: ci

# What runs for a change, in short (docs/runbooks/ci-runners.md has the full table):
#   - "what changed" reads the diff and decides which jobs are needed.
#   - Cheap checks (lint) run first; the slow test jobs start only if they pass.
#   - "ci" at the end is the one result to look at (and to require, if branch
#     protection ever allows it).
#
# Where the jobs run is one repository variable, so switching needs no commit:
#   gh variable set CI_RUNNERS --body github-hosted --repo jfcmartins/limen   # GitHub-hosted (uses hosted minutes)
#   gh variable delete CI_RUNNERS --repo jfcmartins/limen                     # back to the self-hosted runners
# Releases always use hosted runners (the release workflow passes hosted: true).

on:
  push:
    branches: [main]
  # Pull requests are opened as drafts and run nothing until they are marked
  # ready for review (the ready_for_review type starts the run then).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # New advisories are published without any commit here, so the dependency
  # audit also runs on a schedule. Nothing else does.
  schedule:
    - cron: "17 5 * * 1-5"
  # The release workflow runs the whole suite before it builds anything, and
  # dispatches it for the release pull request (whose commits are pushed with
  # the workflow token, which doesn't start workflows by itself).
  workflow_call:
    inputs:
      # The release gate sets this, so releases only use GitHub-hosted runners.
      hosted:
        description: Run on GitHub-hosted runners instead of the self-hosted ones
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (When the release workflow calls this one, github.workflow is the caller's name.)
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs. A push to main always runs to the end, so a
  # quick follow-up commit can't hide the result of the one before it.
  # (Do not add concurrency groups to single jobs: they cancelled queued jobs.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Decide what this change needs
  # ---------------------------------------------------------------------------
  changes:
    name: What changed
    # Every other job needs this one, so a draft pull request runs nothing.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      images: ${{ steps.filter.outputs.images }}
      supply_chain: ${{ steps.filter.outputs.supply_chain }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
      # The runner labels every other job uses, so they are written down once (here).
      arm64: ${{ steps.runners.outputs.arm64 }}
      x64: ${{ steps.runners.outputs.x64 }}
      macos: ${{ steps.runners.outputs.macos }}
    steps:
      # Same as the checkout the other jobs use (see "lint"), plus the full
      # history, which the merge base below needs.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fetch_args=(--no-tags origin "$GITHUB_REF")
          [ -f .git/shallow ] && fetch_args+=(--unshallow)
          git fetch "${fetch_args[@]}"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline

      - name: Pick the runners
        id: runners
        env:
          HOSTED: ${{ inputs.hosted || vars.CI_RUNNERS == 'github-hosted' }}
        run: |
          if [ "$HOSTED" = true ]; then
            labels=('arm64="ubuntu-24.04-arm"' 'x64="ubuntu-24.04"' 'macos="macos-latest"')
          else
            labels=('arm64=["self-hosted","Linux","ARM64"]' 'x64=["self-hosted","Linux","X64"]' 'macos=["self-hosted","macOS","ARM64"]')
          fi
          printf '%s\n' "${labels[@]}" >> "$GITHUB_OUTPUT"

      - name: Decide which jobs are needed
        id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          # Releases, manual runs and a change to this file (or to the composite
          # actions) run everything, so the workflow is tested by the workflow.
          RUN_ALL: ${{ inputs.hosted || github.event_name == 'workflow_dispatch' }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail

          # Which files make which job necessary. When in doubt, a job runs.
          ci_files='^\.github/(workflows/ci\.yml|actions/)'
          rust_code='^(crates/|proto/|Cargo\.(toml|lock)$|(rust-toolchain|clippy|rustfmt)\.toml$|mise\.toml$)'
          # What the tests start or read besides the code: the Docker build,
          # the pinned image versions, and the database and S3 test targets.
          test_support='^(deploy/docker/|deploy/compose/\.env$|deploy/compose/config/(targets|s3)/|scripts/(check-versions|ci-db-targets)\.sh$)'
          images_re='^(crates/|proto/|deploy/docker/|deploy/compose/\.env$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
          supply_chain_re='(^|/)Cargo\.(toml|lock)$|^(deny|mise)\.toml$'
          # Dashboards are generated from metric names, so crates count too.
          infra_re='^(crates/|deploy/terraform/|deploy/grafana/|deploy/compose/config/dev-users\.toml$|deploy/compose/scripts/gen-dev-users\.py$)'
          workflows_re='^\.github/(workflows|actions)/'

          rust=false; images=false; supply_chain=false; infra=false; workflows=false
          all() { rust=true; images=true; supply_chain=true; infra=true; workflows=true; }

          if [ "$SCHEDULED" = true ]; then
            supply_chain=true
            echo "Scheduled run: only the dependency audit."
          elif [ "$RUN_ALL" = true ] || ! base="$(git merge-base "$BASE" "$HEAD" 2>/dev/null)"; then
            # No base commit (new branch, manual run) means we can't tell.
            all
            echo "Running every job."
          else
            changed="$(git diff --name-only "$base" "$HEAD")"
            echo "Changed files:"; echo "$changed"
            touches() { grep -Eq "$1" <<<"$changed"; }

            if touches "$ci_files"; then all; fi
            if touches "$rust_code|$test_support"; then rust=true; fi
            if touches "$images_re";               then images=true; fi
            if touches "$supply_chain_re";         then supply_chain=true; fi
            if touches "$infra_re";                then infra=true; fi
            if touches "$workflows_re";            then workflows=true; fi
          fi

          {
            echo "rust=$rust"
            echo "images=$images"
            echo "supply_chain=$supply_chain"
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Cheap checks first: a failure here saves the slow jobs from running
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (fmt, clippy, image versions)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.arm64) }}
    timeout-minutes: 30
    steps:
      # GitHub rate limits the actions/checkout download (HTTP 429) when several
      # self-hosted runners fetch it at once, so this fetches with git instead.
      # The token reaches git through the environment and is never written to
      # disk. Every job below repeats this step with `*checkout`.
      - &checkout
        name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc
      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read the cache from main but don't write one: saving
          # it took over a minute at the end of every job.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Image versions live in deploy/compose/.env; the places that cannot read it must agree.
      - name: Image versions agree
        run: scripts/check-versions.sh
      # Don't depend on how the toolchain was installed or cached.
      - name: Add rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check
      - name: Lints (cargo clippy)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Not gated on lint: it is quick, and it also runs on a schedule.
  supply-chain:
    name: Dependency audit (cargo-deny, cargo-audit)
    needs: changes
    if: needs.changes.outputs.supply_chain == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.arm64) }}
    timeout-minutes: 20
    steps:
      - *checkout
      - name: Install cargo-deny and cargo-audit
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust cargo-deny cargo:cargo-audit
      - name: Licenses, bans and sources (cargo deny)
        run: cargo deny --locked check
      - name: Known vulnerabilities (cargo audit)
        run: cargo audit

  workflow-lint:
    name: Workflow lint (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.arm64) }}
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Install actionlint
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          # actionlint also runs shellcheck on every `run:` script, when it can find it.
          install_args: actionlint shellcheck
      - name: Lint the workflows
        run: actionlint

  infra:
    name: Terraform, dashboards, dev users
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.arm64) }}
    timeout-minutes: 15
    steps:
      - *checkout
      - name: Install Terraform
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: terraform
      - name: Terraform formatting
        run: terraform fmt -check -recursive deploy/terraform
      - name: Terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/examples/audit; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Generated dashboards are up to date
        run: |
          python3 deploy/grafana/generate.py
          git diff --exit-code -- deploy/grafana
      - name: Dev users file and what is generated from it agree
        run: python3 deploy/compose/scripts/gen-dev-users.py --check

  # ---------------------------------------------------------------------------
  # Slow jobs, started once lint has passed
  # ---------------------------------------------------------------------------

  # Integration tests need PostgreSQL and a KMS emulator, which run as
  # service containers on Linux runners.
  test-linux:
    name: Tests (Linux ${{ matrix.arch }})
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: ${{ fromJSON(needs.changes.outputs[matrix.arch]) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: limen
          POSTGRES_PASSWORD: limen-ci
          POSTGRES_DB: limen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U limen -d limen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      kms:
        image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
        ports: ["8099:8080"]
    env:
      # Each integration test links the whole workspace plus the AWS SDK. With
      # debug info the x86 runner's disk filled up ("No space left on device").
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # The self-hosted VMs have 8 GiB. Compiling test binaries in parallel ran them
      # out of memory (the OOM killer stopped the runner), so compile two at a time.
      CARGO_BUILD_JOBS: "2"
      # Warnings from the components under test show up in the log when a test fails.
      LIMEN_TEST_LOG: "1"
      RUST_LOG: warn
      LIMEN_TEST_DATABASE_URL: postgres://limen:limen-ci@localhost:5432/limen
      LIMEN_TEST_KMS_ENDPOINT: http://localhost:8099
      LIMEN_TEST_S3_ENDPOINT: http://localhost:8333
      # The test identity in deploy/compose/config/s3/s3.json.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      # Hosted runners are short on disk: free some before building and before
      # SeaweedFS (below) tries to allocate volumes. Self-hosted machines have room.
      - name: Free disk space (hosted runners only)
        if: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - *checkout
      # Service containers can't take a command or mount repo files, so S3 starts here.
      - name: Start SeaweedFS (S3)
        run: >-
          . deploy/compose/.env;
          docker rm -f s3 >/dev/null 2>&1 || true;
          docker run -d --name s3 -p 8333:8333
          -v "$GITHUB_WORKSPACE/deploy/compose/config/s3/s3.json:/etc/seaweedfs/s3.json:ro"
          "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=512
      # PostgreSQL and MySQL for the database tests (Phase 6) and MongoDB (Phase 9):
      # started with plain docker like S3, and it exports LIMEN_TEST_PG_TARGET,
      # LIMEN_TEST_MYSQL_TARGET, LIMEN_TEST_PG_CA_FILE, LIMEN_TEST_MONGO_TARGET,
      # LIMEN_TEST_MONGO_CA_FILE, and LIMEN_TEST_MONGO_CLIENT_PEM to the steps below.
      - name: Start the database targets (PostgreSQL, MySQL, MongoDB)
        run: scripts/ci-db-targets.sh start
      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc
      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run all tests (a skipped integration test fails the job)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee test.log
          if grep -q '^SKIPPED:' test.log; then grep '^SKIPPED:' test.log; exit 1; fi
      - name: Stop the database targets
        if: always()
        run: scripts/ci-db-targets.sh stop

  # macOS runners have no service containers, so integration tests skip
  # there (they print SKIPPED). Unit tests still run.
  test-macos:
    name: Tests (macOS, unit only)
    needs: [changes, lint]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos) }}
    timeout-minutes: 45
    steps:
      - *checkout
      - name: Install the Rust toolchain and protoc
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: rust protoc
      - name: Restore the build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run all tests
        run: cargo test --workspace --all-features --locked

  # One job for all three images: the builder stage compiles once and the other
  # two targets reuse its layers from the same Docker daemon.
  images:
    name: Container images
    needs: [changes, lint]
    if: needs.changes.outputs.images == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.x64) }}
    timeout-minutes: 60
    env:
      # The Dockerfile uses BuildKit's --mount. Hosted runners enable it by default.
      DOCKER_BUILDKIT: "1"
    steps:
      - *checkout
      - name: Build each image and run it with --version
        run: |
          set -euo pipefail
          . deploy/compose/.env   # RUST_IMAGE and DISTROLESS_IMAGE: the Dockerfile has no default for them
          for target in control-plane proxy worker; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg DISTROLESS_IMAGE="$DISTROLESS_IMAGE" \
              -t "limen-${target}:ci" .
            docker run --rm "limen-${target}:ci" --version
          done

  # ---------------------------------------------------------------------------
  # The result
  # ---------------------------------------------------------------------------

  # The one check to look at (and to require, if branch protection ever allows it).
  # Jobs skipped by the change filter count as passing; a failed or cancelled job fails this.
  ci:
    name: ci
    needs: [changes, lint, supply-chain, workflow-lint, infra, test-linux, test-macos, images]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Every needed job passed or was skipped
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
