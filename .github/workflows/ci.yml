name: ci

# Where the jobs run is one repository variable, so switching is a settings change
# and needs no commit:
#   CI_RUNNERS=github-hosted  -> GitHub-hosted runners (uses your hosted minutes)
#   CI_RUNNERS unset or any other value -> the self-hosted runners
#   gh variable set CI_RUNNERS --body github-hosted --repo jfcmartins/limen   # switch to hosted
#   gh variable delete CI_RUNNERS --repo jfcmartins/limen                     # back to self-hosted
# Releases always use hosted runners (the release workflow passes hosted: true).

on:
  push:
    branches: [main]
  # Pull requests are opened as drafts and run nothing until they are marked
  # ready for review (the ready_for_review type starts the run then).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The release workflow runs the whole suite before it builds anything, and
  # dispatches it for the release pull request (whose commits are pushed with
  # the workflow token, which doesn't start workflows by itself).
  workflow_call:
    inputs:
      # The release gate sets this, so releases only use GitHub-hosted runners.
      hosted:
        description: Run on GitHub-hosted runners instead of the self-hosted ones
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (When the release workflow calls this one, github.workflow is the caller's name.)
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede pull request runs. A push to main always runs to the end, so a
  # quick follow-up commit can't hide the result of the one before it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Decides which jobs this change needs. Docs-only changes run nothing heavy.
  # Releases and manual runs (workflow_dispatch) always run everything.
  changes:
    name: what changed
    # Every other job needs this one, so a draft pull request runs nothing.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      # Fetches this run's commit with full history (for the merge base), without
      # actions/checkout: GitHub rate limits that download (HTTP 429) when several
      # self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          fetch_args=(--no-tags origin "$GITHUB_REF")
          [ -f .git/shallow ] && fetch_args+=(--unshallow)
          git fetch "${fetch_args[@]}"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          RUN_ALL: ${{ inputs.hosted || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          # Code the Rust jobs build, test or package. CI's own files count too,
          # so a change to the workflows is checked by the full suite.
          rust_re='^(crates/|proto/|deploy/docker/|deploy/compose/\.env$|scripts/check-versions\.sh$|\.github/|Cargo\.(toml|lock)$|(rust-toolchain|clippy|rustfmt|deny)\.toml$|mise\.toml$)'
          # Infrastructure code, plus crates (dashboards are generated from metric names).
          infra_re='^(crates/|deploy/terraform/|deploy/grafana/|deploy/compose/config/dev-users\.toml$|deploy/compose/scripts/gen-dev-users\.py$|\.github/)'
          workflows_re='^\.github/'
          # No base commit (new branch, manual run) means we can't tell, so run everything.
          if [ "$RUN_ALL" = true ] || ! base="$(git merge-base "$BASE" "$HEAD" 2>/dev/null)"; then
            rust=true; infra=true; workflows=true
            echo "Running every job."
          else
            changed="$(git diff --name-only "$base" "$HEAD")"
            echo "Changed files:"; echo "$changed"
            rust=false; infra=false; workflows=false
            grep -Eq "$rust_re" <<<"$changed" && rust=true
            grep -Eq "$infra_re" <<<"$changed" && infra=true
            grep -Eq "$workflows_re" <<<"$changed" && workflows=true
          fi
          {
            echo "rust=$rust"
            echo "infra=$infra"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          echo "rust=$rust infra=$infra workflows=$workflows"

  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 30
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Image versions live in deploy/compose/.env; the places that cannot read it must agree.
      - name: Image versions agree
        run: scripts/check-versions.sh
      # Don't depend on how the toolchain was installed or cached.
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Integration tests need PostgreSQL and a KMS emulator, which run as
  # service containers on Linux runners.
  test-linux:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            self-hosted: '["self-hosted","Linux","X64"]'
          - os: ubuntu-24.04-arm
            self-hosted: '["self-hosted","Linux","ARM64"]'
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && matrix.os || fromJSON(matrix.self-hosted) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: limen
          POSTGRES_PASSWORD: limen-ci
          POSTGRES_DB: limen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U limen -d limen"
          --health-interval 2s --health-timeout 3s --health-retries 30
      kms:
        image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
        ports: ["8099:8080"]
    env:
      # Each integration test links the whole workspace plus the AWS SDK. With
      # debug info the x86 runner's disk filled up ("No space left on device").
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      # The self-hosted VMs have 8 GiB. Compiling test binaries in parallel ran them
      # out of memory (the OOM killer stopped the runner), so compile two at a time.
      CARGO_BUILD_JOBS: "2"
      # Warnings from the components under test show up in the log when a test fails.
      LIMEN_TEST_LOG: "1"
      RUST_LOG: warn
      LIMEN_TEST_DATABASE_URL: postgres://limen:limen-ci@localhost:5432/limen
      LIMEN_TEST_KMS_ENDPOINT: http://localhost:8099
      LIMEN_TEST_S3_ENDPOINT: http://localhost:8333
      # The test identity in deploy/compose/config/s3/s3.json.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      # Hosted runners are short on disk: free some before building and before
      # SeaweedFS (below) tries to allocate volumes. Self-hosted machines have room.
      - name: Free disk space
        if: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      # Service containers can't take a command or mount repo files, so S3 starts here.
      - name: Start SeaweedFS (S3)
        run: >-
          . deploy/compose/.env;
          docker rm -f s3 >/dev/null 2>&1 || true;
          docker run -d --name s3 -p 8333:8333
          -v "$GITHUB_WORKSPACE/deploy/compose/config/s3/s3.json:/etc/seaweedfs/s3.json:ro"
          "$SEAWEEDFS_IMAGE" server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=512
      # PostgreSQL and MySQL for the database tests (Phase 6) and MongoDB (Phase 9):
      # started with plain docker like S3, and it exports LIMEN_TEST_PG_TARGET,
      # LIMEN_TEST_MYSQL_TARGET, LIMEN_TEST_PG_CA_FILE, LIMEN_TEST_MONGO_TARGET,
      # LIMEN_TEST_MONGO_CA_FILE, and LIMEN_TEST_MONGO_CLIENT_PEM to the steps below.
      - name: Start the database targets
        run: scripts/ci-db-targets.sh start
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test (and fail if any integration test skipped)
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee test.log
          if grep -q '^SKIPPED:' test.log; then grep '^SKIPPED:' test.log; exit 1; fi
      - name: Stop the database targets
        if: always()
        run: scripts/ci-db-targets.sh stop

  # macOS runners have no service containers, so integration tests skip
  # there (they print SKIPPED). Unit tests still run.
  test-macos:
    name: test (macos)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 45
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64"]') }}
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --all-features --locked

  supply-chain:
    name: cargo-deny + cargo-audit
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 20
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: cargo deny --locked check
      - run: cargo audit

  # One job for all three images: the builder stage compiles once and the other
  # two targets reuse its layers from the same Docker daemon.
  images:
    name: images
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 60
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64"]') }}
    env:
      # The Dockerfile uses BuildKit's --mount. Hosted runners enable it by default.
      DOCKER_BUILDKIT: "1"
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - name: Build and smoke test
        run: |
          set -euo pipefail
          . deploy/compose/.env   # RUST_IMAGE and DISTROLESS_IMAGE: the Dockerfile has no default for them
          for target in control-plane proxy worker; do
            docker build -f deploy/docker/Dockerfile --target "$target" \
              --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg DISTROLESS_IMAGE="$DISTROLESS_IMAGE" \
              -t "limen-${target}:ci" .
            docker run --rm "limen-${target}:ci" --version
          done

  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    timeout-minutes: 10
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: actionlint

  terraform-and-dashboards:
    name: terraform validate + dashboards
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    timeout-minutes: 15
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    steps:
      # Fetches this run's commit without actions/checkout: GitHub rate limits the
      # action download (HTTP 429) when several self-hosted runners fetch it at once.
      # The token reaches git through the environment and is never written to disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: terraform
      - name: terraform fmt
        run: terraform fmt -check -recursive deploy/terraform
      - name: terraform validate
        run: |
          for dir in deploy/terraform/modules/audit deploy/terraform/modules/datadog deploy/terraform/examples/audit; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Generated dashboards are up to date
        run: |
          python3 deploy/grafana/generate.py
          git diff --exit-code -- deploy/grafana
      - name: Dev users file and what is generated from it agree
        run: python3 deploy/compose/scripts/gen-dev-users.py --check

  # The one check to look at (and to require, if branch protection ever allows it).
  # Jobs skipped by the change filter count as passing; a failed or cancelled job fails this.
  ci:
    name: ci
    needs: [changes, lint, test-linux, test-macos, supply-chain, images, actionlint, terraform-and-dashboards]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    timeout-minutes: 5
    runs-on: ${{ (inputs.hosted || vars.CI_RUNNERS == 'github-hosted') && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Every needed job passed or was skipped
        run: |
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) echo "Results: $RESULTS"; exit 1 ;;
          esac
          echo "Results: $RESULTS"
