name: ci

# The one entry point of CI. It works out which areas a change touches (scripts/ci-changes.sh,
# the rules the per-area workflows used to have as `paths:`) and calls only those workflows, so a
# website change never builds the Rust code and a Rust change never builds the site.
#
# The last job, `ci`, passes when everything that ran passed (skipped areas count as passed). It is
# the one status check the ruleset on main requires: a workflow skipped by a `paths:` filter
# reports nothing, and a required check that never reports blocks the pull request for ever.
#
# A draft pull request runs nothing; marking it ready for review starts it.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A manual run runs every area.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Which areas changed
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      audit: ${{ steps.areas.outputs.audit }}
      infra: ${{ steps.areas.outputs.infra }}
      workflows: ${{ steps.areas.outputs.workflows }}
      website: ${{ steps.areas.outputs.website }}
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request runs on the merge of its branch into main, so its first parent is the
      # tip of main it would land on. A push compares with what was there before.
      - name: Work out the areas
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then base="HEAD^1"; elif [ "$EVENT" = push ]; then base="$BEFORE"; fi
          scripts/ci-changes.sh "$base" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml
    permissions:
      contents: read

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.audit == 'true'
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: ./.github/workflows/ci-workflows.yml
    permissions:
      contents: read

  website:
    name: website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/ci-website.yml
    permissions:
      contents: read

  # A secret can be in any file, so this has no area.
  secrets:
    name: secrets
    needs: changes
    uses: ./.github/workflows/secret-scan.yml
    permissions:
      contents: read

  ci:
    name: ci
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [changes, rust, audit, infra, workflows, website, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Everything that ran passed
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
