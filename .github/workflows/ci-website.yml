name: ci-website

# Builds the site and runs its link and rule checks (npm run build).
# Self-hosted runners, unless CI_RUNNERS=github-hosted (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
    # The build publishes docs/ and the compose README into the site.
    paths: &paths
      - "website/**"
      - "docs/**"
      - "deploy/compose/README.md"
      - "mise.toml"
      - ".github/workflows/ci-website.yml"
  # A draft pull request runs nothing; marking it ready for review starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *paths
  # A manual run ignores the path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    name: Website build and checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ vars.CI_RUNNERS == 'github-hosted' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64"]') }}
    timeout-minutes: 15
    steps:
      # Fetched with git, not actions/checkout, whose download is rate limited (HTTP 429)
      # when several self-hosted runners start at once. The token never touches disk.
      - name: Check out the commit
        env:
          CI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          auth="$(printf 'x-access-token:%s' "$CI_TOKEN" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git fetch --no-tags --depth=1 origin "$GITHUB_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdx
          git log -1 --oneline

      - name: Install Node
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node

      - name: Install the dependencies
        working-directory: website
        run: npm ci

      # Publishes the docs, builds the site, then fails on a broken link or anchor,
      # a third-party request, or a claim ADR-0031 forbids.
      - name: Build and check the site
        working-directory: website
        run: npm run build
