name: ci-website

# Builds the site and runs its link and rule checks (npm run build).
# GitHub-hosted runners (docs/runbooks/ci-runners.md).
# Started by ci.yml when the site, docs/ or the compose README change.

on:
  workflow_call:
  # A manual run runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    name: Website build and checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: node

      - name: Install the dependencies
        working-directory: website
        run: npm ci

      # Publishes the docs, builds the site, then fails on a broken link or anchor,
      # a third-party request, or a claim ADR-0031 forbids.
      - name: Build and check the site
        working-directory: website
        run: npm run build
