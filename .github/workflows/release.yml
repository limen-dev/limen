name: release

# Releases are made by merging the release pull request that release-please
# keeps open on main (ADR-0024). Merging it tags the commit and creates a
# *draft* GitHub release; the jobs below test, build, publish and attach
# everything to that draft. Nobody tags by hand.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  please:
    name: release pull request
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr_branch: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Cargo.lock names every workspace crate's version, and CI builds with
  # --locked, so the release PR needs the lock file refreshed. Commits pushed
  # with the workflow token don't start workflows, so CI is dispatched by hand.
  lockfile:
    name: refresh Cargo.lock on the release PR
    needs: please
    if: needs.please.outputs.prs_created == 'true' && needs.please.outputs.pr_branch != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.pr_branch }}
          persist-credentials: true
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Refresh the lock file
        run: cargo update --workspace
      - name: Commit it, if it changed
        env:
          BRANCH: ${{ needs.please.outputs.pr_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then echo "Cargo.lock is current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the release"
          git push origin "HEAD:${BRANCH}"
      - name: Run CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.please.outputs.pr_branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  # The whole suite must pass on the exact commit before anything is built.
  verify:
    name: verify
    needs: please
    if: needs.please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    # Releases use GitHub-hosted runners only, never the self-hosted machines.
    with:
      hosted: true
    permissions:
      contents: read

  binaries:
    name: binaries (${{ matrix.target }})
    needs: [please, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on the Apple Silicon runner.
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ needs.please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.sha }}
          persist-credentials: false
      - name: The tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "v${version}" = "${TAG}" ] || { echo "tag ${TAG} but Cargo.toml says ${version}" >&2; exit 1; }
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Add target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}" --bins
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="limen-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          for bin in limen limen-control-plane limen-proxy limen-worker limen-audit-verify; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${name}/"
          done
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limen-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Each architecture builds natively (no emulation). The three images share
  # the builder stage, so it compiles once per architecture.
  images:
    name: images (${{ matrix.arch }})
    needs: [please, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push by digest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p digests
          . deploy/compose/.env   # RUST_IMAGE and DISTROLESS_IMAGE: the Dockerfile has no default for them
          for target in control-plane proxy worker; do
            docker buildx build \
              --build-arg RUST_IMAGE="$RUST_IMAGE" --build-arg DISTROLESS_IMAGE="$DISTROLESS_IMAGE" \
              --file deploy/docker/Dockerfile --target "$target" \
              --platform "linux/${ARCH}" \
              --provenance=false \
              --output "type=image,name=ghcr.io/${owner}/limen-${target},push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "meta-${target}.json" .
            jq -r '."containerimage.digest"' "meta-${target}.json" > "digests/${target}-${ARCH}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifests:
    name: image manifests
    needs: [please, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ needs.please.outputs.tag_name }}
      PUBLIC: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event.repository.private == false
      - name: Combine the architectures into one tag
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${TAG#v}"
          minor="${version%.*}"
          for target in control-plane proxy worker; do
            image="ghcr.io/${owner}/limen-${target}"
            tags=(--tag "${image}:${TAG}")
            # A floating minor tag only for final releases. There is no "latest".
            case "$version" in *-*) ;; *) tags+=(--tag "${image}:${minor}") ;; esac
            docker buildx imagetools create "${tags[@]}" \
              "${image}@$(cat "digests/${target}-amd64")" \
              "${image}@$(cat "digests/${target}-arm64")"
            digest="$(docker buildx imagetools inspect "${image}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${image}@${digest}" >> image-refs.txt
            # Signatures and public transparency-log entries only make sense
            # once the repository is public: Rekor is public and would
            # otherwise publish this private repository's name.
            if [ "$PUBLIC" = "true" ]; then cosign sign --yes "${image}@${digest}"; fi
          done
          cat image-refs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-refs
          path: image-refs.txt

  sbom:
    name: SBOM and deploy bundle
    needs: [please, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TAG: ${{ needs.please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.please.outputs.sha }}
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: limen-${{ needs.please.outputs.tag_name }}.sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bundle the compose stack, dashboards and Terraform modules
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "limen-${TAG}.sbom.cdx.json" dist/
          git archive --format=zip --prefix="limen-${TAG}/" -o "dist/limen-${TAG}-deploy.zip" HEAD \
            deploy/compose deploy/terraform deploy/grafana docs/runbooks LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-deploy
          path: dist/*
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: [please, binaries, manifests, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.tar.gz *.zip *.json image-refs.txt > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.private == false
        with:
          subject-path: dist/*.tar.gz
      - name: Smoke test the published artifacts
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          while read -r ref; do
            echo "== ${ref}"
            docker run --rm "${ref}" --version
          done < dist/image-refs.txt
          mkdir smoke
          tar -C smoke -xzf "dist/limen-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          "smoke/limen-${TAG}-x86_64-unknown-linux-gnu/limen" --version
      - name: Upload to the draft release
        run: |
          set -euo pipefail
          files=(dist/*.tar.gz dist/*.zip dist/*.sbom.cdx.json dist/SHA256SUMS dist/image-refs.txt)
          gh release upload "${TAG}" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish, when the pipeline is trusted
        env:
          AUTO_PUBLISH: ${{ vars.RELEASE_AUTO_PUBLISH }}
        run: |
          if [ "${AUTO_PUBLISH:-}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            echo "The release stays a draft. Review it, then publish it from the Releases page" \
                 "(or set the repository variable RELEASE_AUTO_PUBLISH to true)."
          fi
