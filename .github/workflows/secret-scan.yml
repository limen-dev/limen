name: secret-scan

# gitleaks over the whole git history, not just the change: a secret that was committed and
# then deleted is still readable in the log. Reviewed false positives are in .gitleaksignore.
# Started by ci.yml for every change, with no path filter: a secret can be in any file.

on:
  workflow_call:
  # A manual run runs every job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: gitleaks

      # --redact keeps a finding's value out of the public log. Exit code 1: a finding.
      - name: Scan the history
        run: gitleaks git --redact --no-banner --verbose .
