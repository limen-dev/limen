name: workflows

# actionlint on the workflows.
# GitHub-hosted runners (docs/runbooks/ci-runners.md).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  # Pull requests start this through ci.yml, which reads the paths above (the required check is ci-ok).
  # Called by release.yml, which tests the exact commit before building anything.
  workflow_call:
  # A manual run ignores the path filter.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # (github.workflow is release.yml's name when it calls this, hence the prefix.)
  group: workflows-${{ github.workflow }}-${{ github.ref }}
  # A new push cancels the older pull request run; a push to main always runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          # actionlint runs shellcheck on `run:` scripts when it is installed.
          install_args: actionlint shellcheck

      - name: Lint the workflows
        run: actionlint
