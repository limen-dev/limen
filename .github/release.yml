# Groups the notes GitHub generates for a release (ADR-0023).
changelog:
  exclude:
    labels: [chore, ignore-for-release]
  categories:
    # Pre-1.0 breaking changes (ADR-0024). Label the pull request `breaking-change`.
    - title: Upgrade notes
      labels: [breaking-change]
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
