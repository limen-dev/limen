version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  # Container images are pinned in deploy/compose/.env and checked by
  # scripts/check-versions.sh, so Dependabot does not manage docker. The bump-images workflow
  # (scripts/bump-images.py) does that instead (see #94).
