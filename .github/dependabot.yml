version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Container images are pinned in deploy/compose/.env and checked by
  # scripts/check-versions.sh, so Dependabot does not manage docker.
