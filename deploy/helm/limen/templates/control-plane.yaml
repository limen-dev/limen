{{- range $key, $over := .Values.controlPlanes }}
{{- $c := include "limen.merged" (dict "defaults" $.Values.controlPlaneDefaults "over" $over) | fromYaml }}
{{- $kms := $c.kms }}
{{- $ref := dict "component" "control-plane" "key" $key }}
{{- $name := printf "control-plane-%s" $key }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{ include "limen.labels" $ref | nindent 4 }}
spec:
  # Headless: the name resolves to the ready replicas (ADR-0020).
  clusterIP: None
  selector: {{ include "limen.selector" $ref | nindent 4 }}
  ports:
    - { name: grpc, port: 3080, targetPort: grpc }
---
{{- if $c.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{ include "limen.labels" $ref | nindent 4 }}
  {{- with $c.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{ include "limen.labels" $ref | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: {{ $c.replicas }}
  podManagementPolicy: OrderedReady
  updateStrategy: { type: RollingUpdate }
  selector:
    matchLabels: {{ include "limen.selector" $ref | nindent 6 }}
  template:
    metadata:
      labels: {{ include "limen.labels" $ref | nindent 8 }}
    spec:
      {{- if $c.serviceAccount.create }}
      serviceAccountName: {{ $name }}
      {{- end }}
      {{- include "limen.pullSecrets" $ | nindent 6 }}
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      {{- with $c.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: {{ include "limen.selector" $ref | nindent 20 }}
      containers:
        - name: {{ $name }}
          image: {{ include "limen.image" (dict "root" $ "component" "control-plane") }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: grpc, containerPort: 3080 }
            - { name: admin, containerPort: 3081 }
          env:
            # Stable pod names make a restarted replica resume its own spool.
            - name: LIMEN_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: LIMEN_SPOOL_MODE, value: durable }
            - { name: LIMEN_AUDIT_SPOOL_DIR, value: /var/lib/limen/spool }
            - { name: LIMEN_DNS_NAMES, value: "{{ $name }},$(LIMEN_ID).{{ $name }}" }
            - { name: LIMEN_ADVERTISE_URL, value: "https://$(LIMEN_ID).{{ $name }}:3080" }
            - { name: LIMEN_DRAIN_TIMEOUT, value: {{ $c.drainTimeout | quote }} }
            # The public CA certificates are written here; copy internal-ca.pem
            # out once for the proxies and workers (see README.md).
            - { name: LIMEN_CA_EXPORT_DIR, value: /var/lib/limen/ca-public }
            - { name: LIMEN_CA_BACKEND, value: kms }
            - { name: LIMEN_KMS_INTERNAL_CA_KEY, value: {{ required "controlPlanes.<key>.kms.internalCaKey is required" $kms.internalCaKey | quote }} }
            - { name: LIMEN_KMS_USER_CA_KEY, value: {{ required "controlPlanes.<key>.kms.userCaKey is required" $kms.userCaKey | quote }} }
            - { name: LIMEN_KMS_SSH_USER_CA_KEY, value: {{ required "controlPlanes.<key>.kms.sshUserCaKey is required" $kms.sshUserCaKey | quote }} }
            - { name: LIMEN_KMS_SSH_HOST_CA_KEY, value: {{ required "controlPlanes.<key>.kms.sshHostCaKey is required" $kms.sshHostCaKey | quote }} }
            - name: LIMEN_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $c.databaseSecret | default $.Values.existingSecrets.database | quote }}, key: url } }
            - { name: LIMEN_OIDC_ISSUER, value: {{ required "controlPlanes.<key>.oidc.issuer is required" $c.oidc.issuer | quote }} }
            - { name: LIMEN_OIDC_CLIENT_ID, value: {{ required "controlPlanes.<key>.oidc.clientId is required" $c.oidc.clientId | quote }} }
            - { name: LIMEN_AUDIT_S3_BUCKET, value: {{ required "controlPlanes.<key>.auditS3Bucket is required" $c.auditS3Bucket | quote }} }
            {{- with $c.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - { name: spool, mountPath: /var/lib/limen/spool }
            - { name: ca-public, mountPath: /var/lib/limen/ca-public }
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            periodSeconds: 10
          resources: {{ toYaml $c.resources | nindent 12 }}
      volumes:
        - name: ca-public
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: { name: spool }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $c.spool.storageClassName }}
        storageClassName: {{ $c.spool.storageClassName | quote }}
        {{- end }}
        resources: { requests: { storage: {{ $c.spool.size | quote }} } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: {{ include "limen.minAvailable" $c }}
  selector:
    matchLabels: {{ include "limen.selector" $ref | nindent 6 }}
{{- end }}
