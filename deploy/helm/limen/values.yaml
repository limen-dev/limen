# Limen chart values. Everything marked REQUIRED has no default; `helm
# install` fails with a message naming the missing value.
#
# Each of controlPlanes, proxies and workers is a map: add an entry to run one
# more group. An entry overrides the matching *Defaults block, so it holds
# only what differs. Keys become part of every resource name. Example:
#   workers:
#     prod-db: { proxy: public }
#     staging: { proxy: public, replicas: 2 }

image:
  registry: ""          # e.g. ghcr.io/your-org
  tag: ""               # REQUIRED: the Limen release to run
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Secrets and ConfigMaps you create beforehand (see README.md). A group can
# point at its own with `joinSecret`, so each can have its own token.
existingSecrets:
  database: limen-database          # key: url
  proxyJoin: limen-proxy-join       # key: token
  workerJoin: limen-worker-join     # key: token
internalCA:
  configMap: limen-internal-ca      # key: internal-ca.pem

controlPlanes: {}   # REQUIRED unless you run none of this component
controlPlaneDefaults:
  replicas: 3
  drainTimeout: 20s
  # Must exceed drainTimeout by enough to finish the drain and the handoff.
  terminationGracePeriodSeconds: 45
  oidc:
    issuer: ""                      # REQUIRED
    clientId: ""                    # REQUIRED
  auditS3Bucket: ""                 # REQUIRED
  kms:                              # REQUIRED: the KMS CA backend (ADR-0020)
    internalCaKey: ""
    userCaKey: ""
    sshUserCaKey: ""
    sshHostCaKey: ""
  databaseSecret: ""                # default: existingSecrets.database
  spool:
    size: 10Gi
    storageClassName: ""
  pdb: { minAvailable: 2 }
  resources:
    requests: { cpu: 500m, memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  serviceAccount: { create: true, annotations: {} }   # IRSA role for KMS and S3

proxies: {}   # REQUIRED unless you run none of this component
proxyDefaults:
  replicas: 3
  drainTimeoutSecs: 20
  terminationGracePeriodSeconds: 40
  namePrefix: ""                    # REQUIRED: the join token must approve it
  dnsNames: ""                      # REQUIRED: the public DNS name(s) of the load balancer
  controlPlane: ""                  # key of the control plane group to dial; default: the first
  controlPlaneAddr: ""              # overrides controlPlane, e.g. "cp.other-cluster.example.com:3080"
  joinSecret: ""                    # default: existingSecrets.proxyJoin
  service:
    type: LoadBalancer
    port: 443
    annotations:
      # AWS: a Network Load Balancer in TCP mode. TLS is end to end (ADR-0005).
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
  pdb: { minAvailable: 2 }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []

workers: {}   # REQUIRED unless you run none of this component
workerDefaults:
  replicas: 3
  maxSessions: 200
  drainTimeoutSecs: 300
  # Above drainTimeoutSecs plus about 20 s to upload recordings.
  terminationGracePeriodSeconds: 330
  namePrefix: ""                    # REQUIRED
  proxy: ""                         # key of the proxy group to dial; default: the first
  proxyAddr: ""                     # overrides proxy: host:port
  proxyName: ""                     # overrides proxy: the proxy's certificate name
  joinSecret: ""                    # default: existingSecrets.workerJoin
  discovery: false                  # run resource discovery (ADR-0027); see docs/guides/discovery.md
  # IRSA role the worker uses (the one modules/discovery trusts). Creates the service account.
  serviceAccount: { annotations: {} }
  resources:
    requests: { cpu: 250m, memory: 256Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
