# Limen scale-out stack (Phase 5): three control planes on one database,
# three proxies, three workers, S3, Postgres, and Dex. Targets (ssh, db, redis,
# observability...) layer on like the single stack: deploy/compose/setup.sh --scale up.
#
#   docker compose --project-directory deploy/compose -f deploy/compose/stacks/scale.yml up -d --build
#   demos/demo-phase5.sh          # the exit test for Phase 5
#
# A separate project (`limen-scale`) with its own volumes and host ports, so
# it runs next to the dev stack (docker-compose.yml) without touching it.
# Development only: static tokens, Dex static passwords, file-backed CA keys.
#
# Host ports (all on 127.0.0.1):
#   23443/23444  proxy-0 (API / health)    25556  Dex
#   23453/23454  proxy-1                   28333  S3 (SeaweedFS)
#   23463/23464  proxy-2                   23081..23083  control-plane-0..2 health
name: limen-scale

x-limen-image: &limen-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    RUST_IMAGE: ${RUST_IMAGE:?set in deploy/compose/.env}
    DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:?set in deploy/compose/.env}
    # A checkout that builds next to others sets its own cache (see the Dockerfile).
    LIMEN_BUILD_CACHE: ${LIMEN_BUILD_CACHE:-limen-target}

x-control-plane: &control-plane
  build: { <<: *limen-build, target: control-plane }
  image: limen-control-plane:scale
  restart: unless-stopped
  env_file:
    - { path: "${LIMEN_STACK_ENV:-.state/stack.env}", required: false }   # written by setup.sh (observability, bots, redis wiring)
  # Longer than LIMEN_DRAIN_TIMEOUT, so a stop (SIGTERM) drains and hands
  # off instead of being cut short by Docker's SIGKILL.
  stop_grace_period: 40s
  depends_on:
    postgres: { condition: service_healthy }
    dex: { condition: service_started }
    s3: { condition: service_started }

x-control-plane-env: &control-plane-env
  RUST_LOG: ${LIMEN_SCALE_CP_LOG:-info}
  LIMEN_DATABASE_URL: postgres://limen:limen-dev-only@postgres:5432/limen
  # Every replica loads the same CA keys: file-backed keys live on one shared
  # volume (with KMS they'd be KMS key ids); the CA certificates are in the
  # database. Keys are created race-free by whichever replica starts first.
  LIMEN_CA_DIR: /var/lib/limen/ca
  LIMEN_CA_EXPORT_DIR: /var/lib/limen/ca-public
  LIMEN_OIDC_ISSUER: http://localhost:25556/dex
  LIMEN_OIDC_INTERNAL_URL: http://dex:5556/dex
  LIMEN_OIDC_CLIENT_ID: limen-cli
  LIMEN_BOOTSTRAP_ADMIN_GROUPS: limen-admins
  # The same multi-use dev tokens as the dev stack: three proxies and three
  # workers enroll with them. (Single-use tokens are refused on second use.)
  # Here they also approve names (patterns only, as the tokens are reusable):
  # each proxy and worker asks for its own with LIMEN_NAME.
  LIMEN_STATIC_JOIN_TOKENS: "proxy:dev-only-proxy-join-token-7f3a9c1e5b2d4f60:limen.io/name=proxy-*,worker:dev-only-worker-join-token-2c8e6a4b0d1f3e5a:pool=dev;limen.io/name=worker-*${LIMEN_EXTRA_JOIN_TOKENS:-}"
  LIMEN_PROXY_DNS_NAMES: localhost,proxy,proxy-0,proxy-1,proxy-2
  LIMEN_AUDIT_S3_BUCKET: limen-audit
  LIMEN_AUDIT_S3_ENDPOINT: http://s3:8333
  LIMEN_AUDIT_S3_PATH_STYLE: "true"
  LIMEN_AUDIT_S3_CREATE_BUCKET: "true"
  LIMEN_AUDIT_S3_FLUSH: 5s
  LIMEN_DRAIN_TIMEOUT: 20s
  # Proxies' connections are closed (GOAWAY) after ~60 s instead of the
  # default 300 s, so they rebalance onto replicas several times per demo run.
  LIMEN_MAX_CONNECTION_AGE_SECS: ${LIMEN_SCALE_MAX_CONNECTION_AGE_SECS:-60}
  AWS_ACCESS_KEY_ID: dev
  AWS_SECRET_ACCESS_KEY: dev-only-secret
  AWS_REGION: us-east-1
  LIMEN_ENVIRONMENT: dev
  LIMEN_CONSOLE_PUBLIC_URL: https://localhost:23443
  LIMEN_CONSOLE_OIDC_CLIENT_SECRET: dev-only-console-client-secret

x-proxy: &proxy
  build: { <<: *limen-build, target: proxy }
  image: limen-proxy:scale
  restart: unless-stopped
  env_file:
    - { path: "${LIMEN_STACK_ENV:-.state/stack.env}", required: false }   # written by setup.sh (tracing endpoint)
  depends_on: [control-plane-0, control-plane-1, control-plane-2]

x-proxy-env: &proxy-env
  RUST_LOG: ${LIMEN_SCALE_PROXY_LOG:-info}
  # The alias every control plane shares: DNS returns all three.
  LIMEN_CONTROL_PLANE_ADDR: control-plane:3080
  LIMEN_CONTROL_PLANE_NAME: control-plane
  LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
  LIMEN_JOIN_TOKEN: dev-only-proxy-join-token-7f3a9c1e5b2d4f60
  LIMEN_DATA_DIR: /var/lib/limen/proxy

x-worker: &worker
  build: { <<: *limen-build, target: worker }
  image: limen-worker:scale
  restart: unless-stopped
  env_file:
    - { path: "${LIMEN_STACK_ENV:-.state/stack.env}", required: false }   # written by setup.sh (observability, bots, redis wiring)
  # Longer than the workers' LIMEN_DRAIN_TIMEOUT_SECS (20 here) plus 18 s,
  # so a stop (SIGTERM) lets open sessions finish, ends the rest, and
  # uploads their recordings before Docker's SIGKILL.
  stop_grace_period: 40s
  depends_on: [proxy-0, proxy-1, proxy-2]

x-worker-env: &worker-env
  RUST_LOG: info
  # The alias every proxy shares: each worker lands on one of them.
  LIMEN_PROXY_ADDR: proxy:3443
  LIMEN_PROXY_NAME: proxy
  LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
  LIMEN_JOIN_TOKEN: dev-only-worker-join-token-2c8e6a4b0d1f3e5a
  LIMEN_DATA_DIR: /var/lib/limen/worker
  # Short for a demo stack (the default is 600 s); fits stop_grace_period.
  LIMEN_DRAIN_TIMEOUT_SECS: "20"

services:
  postgres:
    container_name: limen-postgres${LIMEN_SUFFIX:-}
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen-dev-only
      POSTGRES_DB: limen
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The dev stack's Dex configuration, with this stack's host ports.
  dex:
    container_name: limen-dex${LIMEN_SUFFIX:-}
    image: ${DEX_IMAGE}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e 's#localhost:5556#localhost:25556#' -e 's#localhost:3443#localhost:23443#'
        /etc/dex/config.yaml > /tmp/dex.yaml && exec dex serve /tmp/dex.yaml
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml:ro
      - ./config/dex/theme:/srv/dex/web/themes/limen:ro
    ports: ["127.0.0.1:25556:5556"]

  s3:
    container_name: limen-s3${LIMEN_SUFFIX:-}
    image: ${SEAWEEDFS_IMAGE}
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports: ["127.0.0.1:28333:8333"]
    volumes: [s3-data:/data, "./config/s3/s3.json:/etc/seaweedfs/s3.json:ro"]

  control-plane-0:
    container_name: limen-control-plane-0${LIMEN_SUFFIX:-}
    <<: *control-plane
    environment:
      <<: *control-plane-env
      LIMEN_ID: control-plane-0
      LIMEN_DNS_NAMES: control-plane-0,control-plane,localhost
      LIMEN_ADVERTISE_URL: https://control-plane-0:3080
      LIMEN_SPOOL_MODE: ${LIMEN_SCALE_SPOOL_MODE_0:-ephemeral}
    networks: { default: { aliases: [control-plane] } }
    ports: ["127.0.0.1:23081:3081"]
    volumes:
      - cp-ca:/var/lib/limen/ca
      - ca-public:/var/lib/limen/ca-public
      - cp-0-spool:/var/lib/limen/spool
      - cp-0-recordings:/var/lib/limen/recordings

  control-plane-1:
    container_name: limen-control-plane-1${LIMEN_SUFFIX:-}
    <<: *control-plane
    environment:
      <<: *control-plane-env
      LIMEN_ID: control-plane-1
      LIMEN_DNS_NAMES: control-plane-1,control-plane,localhost
      LIMEN_ADVERTISE_URL: https://control-plane-1:3080
      LIMEN_SPOOL_MODE: ${LIMEN_SCALE_SPOOL_MODE_1:-durable}
    networks: { default: { aliases: [control-plane] } }
    ports: ["127.0.0.1:23082:3081"]
    volumes:
      - cp-ca:/var/lib/limen/ca
      - ca-public:/var/lib/limen/ca-public
      - cp-1-spool:/var/lib/limen/spool
      - cp-1-recordings:/var/lib/limen/recordings

  control-plane-2:
    container_name: limen-control-plane-2${LIMEN_SUFFIX:-}
    <<: *control-plane
    environment:
      <<: *control-plane-env
      LIMEN_ID: control-plane-2
      LIMEN_DNS_NAMES: control-plane-2,control-plane,localhost
      LIMEN_ADVERTISE_URL: https://control-plane-2:3080
      LIMEN_SPOOL_MODE: ${LIMEN_SCALE_SPOOL_MODE_2:-ephemeral}
    networks: { default: { aliases: [control-plane] } }
    ports: ["127.0.0.1:23083:3081"]
    volumes:
      - cp-ca:/var/lib/limen/ca
      - ca-public:/var/lib/limen/ca-public
      - cp-2-spool:/var/lib/limen/spool
      - cp-2-recordings:/var/lib/limen/recordings

  proxy-0:
    container_name: limen-proxy-0${LIMEN_SUFFIX:-}
    <<: *proxy
    environment:
      <<: *proxy-env
      LIMEN_NAME: proxy-0
      LIMEN_DNS_NAMES: localhost,proxy,proxy-0
      LIMEN_PEER_ADDRESS: proxy-0:3443
    networks: { default: { aliases: [proxy] } }
    ports: ["127.0.0.1:23443:3443", "127.0.0.1:23444:3444"]
    volumes:
      - proxy-0-data:/var/lib/limen/proxy
      - ca-public:/var/lib/limen/ca-public:ro

  proxy-1:
    container_name: limen-proxy-1${LIMEN_SUFFIX:-}
    <<: *proxy
    environment:
      <<: *proxy-env
      LIMEN_NAME: proxy-1
      LIMEN_DNS_NAMES: localhost,proxy,proxy-1
      LIMEN_PEER_ADDRESS: proxy-1:3443
    networks: { default: { aliases: [proxy] } }
    ports: ["127.0.0.1:23453:3443", "127.0.0.1:23454:3444"]
    volumes:
      - proxy-1-data:/var/lib/limen/proxy
      - ca-public:/var/lib/limen/ca-public:ro

  proxy-2:
    container_name: limen-proxy-2${LIMEN_SUFFIX:-}
    <<: *proxy
    environment:
      <<: *proxy-env
      LIMEN_NAME: proxy-2
      LIMEN_DNS_NAMES: localhost,proxy,proxy-2
      LIMEN_PEER_ADDRESS: proxy-2:3443
    networks: { default: { aliases: [proxy] } }
    ports: ["127.0.0.1:23463:3443", "127.0.0.1:23464:3444"]
    volumes:
      - proxy-2-data:/var/lib/limen/proxy
      - ca-public:/var/lib/limen/ca-public:ro

  worker-0:
    container_name: limen-worker-0${LIMEN_SUFFIX:-}
    <<: *worker
    environment: { <<: *worker-env, LIMEN_NAME: worker-0 }
    volumes:
      - worker-0-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      - ./config/targets/redis/credentials.json:/etc/limen/redis-credentials.json:ro
      - ./config/targets/messaging/credentials.json:/etc/limen/broker-credentials.json:ro
      - db-tls:/var/lib/limen/db-tls:ro
      - db-secrets:/var/lib/limen/db-secrets
      - mongo-worker:/etc/limen/mongo:ro

  worker-1:
    container_name: limen-worker-1${LIMEN_SUFFIX:-}
    <<: *worker
    environment: { <<: *worker-env, LIMEN_NAME: worker-1 }
    volumes:
      - worker-1-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      - ./config/targets/redis/credentials.json:/etc/limen/redis-credentials.json:ro
      - ./config/targets/messaging/credentials.json:/etc/limen/broker-credentials.json:ro
      - db-tls:/var/lib/limen/db-tls:ro
      - db-secrets:/var/lib/limen/db-secrets
      - mongo-worker:/etc/limen/mongo:ro

  worker-2:
    container_name: limen-worker-2${LIMEN_SUFFIX:-}
    <<: *worker
    environment: { <<: *worker-env, LIMEN_NAME: worker-2 }
    volumes:
      - worker-2-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      - ./config/targets/redis/credentials.json:/etc/limen/redis-credentials.json:ro
      - ./config/targets/messaging/credentials.json:/etc/limen/broker-credentials.json:ro
      - db-tls:/var/lib/limen/db-tls:ro
      - db-secrets:/var/lib/limen/db-secrets
      - mongo-worker:/etc/limen/mongo:ro

volumes:
  postgres: {}
  db-tls: {}
  db-secrets: {}
  mongo-worker: {}
  s3-data: {}
  cp-ca: {}
  ca-public: {}
  cp-0-spool: {}
  cp-1-spool: {}
  cp-2-spool: {}
  cp-0-recordings: {}
  cp-1-recordings: {}
  cp-2-recordings: {}
  proxy-0-data: {}
  proxy-1-data: {}
  proxy-2-data: {}
  worker-0-data: {}
  worker-1-data: {}
  worker-2-data: {}
