# Redis and Valkey targets with the same ACL file (profile `redis`).
# No TLS here: the target network is local. The ElastiCache path (TLS, IAM) is
# unverified. Layered on a Limen stack by setup.sh redis.
services:
  redis-target:
    container_name: redis-cache-${LIMEN_ENV:-dev}
    profiles: ["redis"]
    image: redis:7.4-alpine
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl"]
    volumes: ["./config/targets/redis/users.acl:/etc/redis/users.acl:ro"]

  valkey-target:
    container_name: valkey-cache-${LIMEN_ENV:-dev}
    profiles: ["redis"]
    image: valkey/valkey:8.0-alpine
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl"]
    volumes: ["./config/targets/redis/users.acl:/etc/valkey/users.acl:ro"]
