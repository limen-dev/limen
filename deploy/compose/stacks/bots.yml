# Fake CI identity issuer for bots (profile `bots`, ADR-0019). setup.sh also
# lets the control plane trust plain-http issuers (LIMEN_BOT_ALLOW_INSECURE_ISSUERS).
x-limen-image: &limen-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile
  args:
    RUST_IMAGE: ${RUST_IMAGE:?set in deploy/compose/.env}
    DISTROLESS_IMAGE: ${DISTROLESS_IMAGE:?set in deploy/compose/.env}
    # A checkout that builds next to others sets its own cache (see the Dockerfile).
    LIMEN_BUILD_CACHE: ${LIMEN_BUILD_CACHE:-limen-target}

services:
  # Stands in for GitHub Actions' token service (ADR-0019, Phase 4 demo).
  # DEVELOPMENT ONLY: it mints any token to anyone who asks.
  fake-ci-issuer:
    container_name: ci-issuer-fake-${LIMEN_ENV:-dev}
    profiles: ["bots"]
    build: { <<: *limen-build, target: fake-ci-issuer }
    image: limen-fake-ci-issuer:dev
    # Another stack beside this one sets its own (demos/demo-phase14.sh does).
    ports: ["127.0.0.1:${LIMEN_PORT_CI_ISSUER:-8130}:8130"]
