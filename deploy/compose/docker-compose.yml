# Limen local development stack.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# Walkthrough: deploy/compose/README.md. Everything here is for local
# development only: static tokens, Dex static passwords, file-backed CA keys.
name: limen

# The core: what Limen needs to run (Postgres, Dex, S3, KMS emulator, control
# plane, proxy, worker). Everything it connects to or reports to is a separate
# file in stacks/, layered on with -f. deploy/compose/setup.sh does that for you:
#   ssh  db  redis  observability  bots   (and `scale`, which replaces this file)
# Stack wiring that needs a setting on a Limen service (a Datadog URL, the
# Redis credentials) goes through .state/stack.env, which setup.sh writes.
#
# Another copy can run beside this one (`docker compose -p <name>`) on other host
# ports: LIMEN_PORT_{POSTGRES,DEX,KMS,S3,CP,PROXY,HEALTH}, and LIMEN_IMAGE_TAG
# so its image builds stay apart.

x-limen-image: &limen-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-dev-tokens:
  # Multi-use tokens so `docker compose up` works unattended. Dev only.
  proxy: &proxy-token dev-only-proxy-join-token-7f3a9c1e5b2d4f60
  worker: &worker-token dev-only-worker-join-token-2c8e6a4b0d1f3e5a

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen-dev-only
      POSTGRES_DB: limen
    ports: ["127.0.0.1:${LIMEN_PORT_POSTGRES:-5432}:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 2s
      timeout: 3s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    # The CLI reaches Dex on the host port; the config names the default ports, so
    # it is rewritten for another stack's (LIMEN_PORT_DEX, LIMEN_PORT_PROXY).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed -e 's#localhost:5556#localhost:${LIMEN_PORT_DEX:-5556}#' -e 's#localhost:3443#localhost:${LIMEN_PORT_PROXY:-3443}#'
        /etc/dex/config.yaml > /tmp/dex.yaml && exec dex serve /tmp/dex.yaml
    volumes:
      - ./config/dex/config.yaml:/etc/dex/config.yaml:ro
      - ./config/dex/theme:/srv/dex/web/themes/limen:ro
    ports: ["127.0.0.1:${LIMEN_PORT_DEX:-5556}:5556"]

  # KMS emulator for testing the KMS-backed CA path. LocalStack now needs an
  # account token, so we use local-kms. Pinned by digest.
  kms:
    image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
    ports: ["127.0.0.1:${LIMEN_PORT_KMS:-8099}:8080"]

  # S3-compatible object store for audit batches and recordings (MinIO no
  # longer publishes images). Requests must be signed with the dev or test
  # keys in config/s3/s3.json: anonymous SeaweedFS rejects the SDK's signed
  # streaming uploads. Development only.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports: ["127.0.0.1:${LIMEN_PORT_S3:-8333}:8333"]
    volumes: [s3-data:/data, "./config/s3/s3.json:/etc/seaweedfs/s3.json:ro"]

  control-plane:
    build: { <<: *limen-build, target: control-plane }
    image: limen-control-plane:${LIMEN_IMAGE_TAG:-dev}
    restart: unless-stopped
    env_file:
      - { path: "${LIMEN_STACK_ENV:-.state/stack.env}", required: false }   # written by setup.sh: observability, bots, redis wiring
    depends_on:
      postgres: { condition: service_healthy }
      dex: { condition: service_started }
      s3: { condition: service_started }
    environment:
      RUST_LOG: info
      LIMEN_ID: control-plane-1
      LIMEN_DATABASE_URL: postgres://limen:limen-dev-only@postgres:5432/limen
      LIMEN_DNS_NAMES: control-plane,localhost
      LIMEN_CA_DIR: /var/lib/limen/ca
      LIMEN_CA_EXPORT_DIR: /var/lib/limen/ca-public
      # The CLI reaches Dex on its host port, the control plane at dex:5556.
      LIMEN_OIDC_ISSUER: http://localhost:${LIMEN_PORT_DEX:-5556}/dex
      LIMEN_OIDC_INTERNAL_URL: http://dex:5556/dex
      LIMEN_OIDC_CLIENT_ID: limen-cli
      LIMEN_BOOTSTRAP_ADMIN_GROUPS: limen-admins
      LIMEN_STATIC_JOIN_TOKENS: "proxy:dev-only-proxy-join-token-7f3a9c1e5b2d4f60,worker:dev-only-worker-join-token-2c8e6a4b0d1f3e5a:pool=dev${LIMEN_EXTRA_JOIN_TOKENS:-}"
      LIMEN_PROXY_DNS_NAMES: localhost,proxy
      # Every component's audit events end up here and in S3 (and Datadog, with the datadog stack).
      LIMEN_AUDIT_FILE: /var/lib/limen/audit/control-plane.jsonl
      LIMEN_AUDIT_S3_BUCKET: limen-audit
      LIMEN_AUDIT_S3_ENDPOINT: http://s3:8333
      LIMEN_AUDIT_S3_PATH_STYLE: "true"
      LIMEN_AUDIT_S3_CREATE_BUCKET: "true"
      LIMEN_AUDIT_S3_FLUSH: 10s
      # The dev identity in s3/s3.json.
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-only-secret
      AWS_REGION: us-east-1
      LIMEN_ENVIRONMENT: dev
      # The web console, served by the proxy at https://localhost:3443/console/
      LIMEN_CONSOLE_PUBLIC_URL: https://localhost:${LIMEN_PORT_PROXY:-3443}
      LIMEN_CONSOLE_OIDC_CLIENT_SECRET: dev-only-console-client-secret
    ports: ["127.0.0.1:${LIMEN_PORT_CP:-3081}:3081"]
    volumes:
      - cp-ca:/var/lib/limen/ca
      - ca-public:/var/lib/limen/ca-public
      - audit:/var/lib/limen/audit
      - cp-spool:/var/lib/limen/spool
      - recordings:/var/lib/limen/recordings

  proxy:
    build: { <<: *limen-build, target: proxy }
    image: limen-proxy:${LIMEN_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on: [control-plane]
    environment:
      RUST_LOG: info
      LIMEN_CONTROL_PLANE_ADDR: control-plane:3080
      LIMEN_CONTROL_PLANE_NAME: control-plane
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *proxy-token
      LIMEN_DNS_NAMES: localhost,proxy
      # How other proxies reach this one for peering (ADR-0004).
      LIMEN_PEER_ADDRESS: proxy:3443
      LIMEN_DATA_DIR: /var/lib/limen/proxy
    ports: ["127.0.0.1:${LIMEN_PORT_PROXY:-3443}:3443", "127.0.0.1:${LIMEN_PORT_HEALTH:-3444}:3444"]
    volumes:
      - proxy-data:/var/lib/limen/proxy
      - ca-public:/var/lib/limen/ca-public:ro

  worker:
    build: { <<: *limen-build, target: worker }
    image: limen-worker:${LIMEN_IMAGE_TAG:-dev}
    restart: unless-stopped
    depends_on: [proxy]
    env_file:
      - { path: "${LIMEN_STACK_ENV:-.state/stack.env}", required: false }   # written by setup.sh: observability, bots, redis wiring
    environment:
      RUST_LOG: info
      LIMEN_PROXY_ADDR: proxy:3443
      LIMEN_PROXY_NAME: proxy
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *worker-token
      LIMEN_DATA_DIR: /var/lib/limen/worker
    volumes:
      - worker-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      # Phase 7: ACL passwords of the Redis users (read when the redis stack sets LIMEN_REDIS_CREDENTIALS_FILE).
      - ./config/targets/redis/credentials.json:/etc/limen/redis-credentials.json:ro
      # Phase 6: the database CA and one password file per database role (filled by the db stack).
      - db-tls:/var/lib/limen/db-tls:ro
      - db-secrets:/var/lib/limen/db-secrets

volumes:
  db-secrets: {}
  db-tls: {}
  postgres: {}
  cp-ca: {}
  ca-public: {}
  audit: {}
  proxy-data: {}
  worker-data: {}
  cp-spool: {}
  s3-data: {}
  recordings: {}
