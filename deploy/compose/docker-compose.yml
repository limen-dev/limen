# Limen local development stack.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# Walkthrough: deploy/compose/README.md. Everything here is for local
# development only: static tokens, Dex static passwords, file-backed CA keys.
name: limen

x-limen-image: &limen-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-dev-tokens:
  # Multi-use tokens so `docker compose up` works unattended. Dev only.
  proxy: &proxy-token dev-only-proxy-join-token-7f3a9c1e5b2d4f60
  worker: &worker-token dev-only-worker-join-token-2c8e6a4b0d1f3e5a

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: limen
      POSTGRES_PASSWORD: limen-dev-only
      POSTGRES_DB: limen
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U limen -d limen"]
      interval: 2s
      timeout: 3s
      retries: 30

  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
      - ./dex/theme:/srv/dex/web/themes/limen:ro
    ports: ["127.0.0.1:5556:5556"]

  # KMS emulator for testing the KMS-backed CA path. LocalStack now needs an
  # account token, so we use local-kms. Pinned by digest.
  kms:
    image: nsmithuk/local-kms@sha256:e070866476b20973a9e23a9b636204b7a222e4169a6e03198d27b80d47ed28e3
    ports: ["127.0.0.1:8099:8080"]

  # S3-compatible object store for audit batches and recordings (MinIO no
  # longer publishes images). Requests must be signed with the dev or test
  # keys in s3/s3.json: anonymous SeaweedFS rejects the SDK's signed
  # streaming uploads. Development only.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports: ["127.0.0.1:8333:8333"]
    volumes: [s3-data:/data, "./s3/s3.json:/etc/seaweedfs/s3.json:ro"]

  # Stands in for Datadog's Logs intake. GET http://localhost:8126/fake/received
  fake-datadog:
    build: { <<: *limen-build, target: fake-datadog }
    image: limen-fake-datadog:dev
    ports: ["127.0.0.1:8126:8126"]

  control-plane:
    build: { <<: *limen-build, target: control-plane }
    image: limen-control-plane:dev
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      dex: { condition: service_started }
      s3: { condition: service_started }
      fake-datadog: { condition: service_started }
    environment:
      RUST_LOG: info
      LIMEN_ID: control-plane-1
      LIMEN_DATABASE_URL: postgres://limen:limen-dev-only@postgres:5432/limen
      LIMEN_DNS_NAMES: control-plane,localhost
      LIMEN_CA_DIR: /var/lib/limen/ca
      LIMEN_CA_EXPORT_DIR: /var/lib/limen/ca-public
      # The CLI reaches Dex at localhost:5556, the control plane at dex:5556.
      LIMEN_OIDC_ISSUER: http://localhost:5556/dex
      LIMEN_OIDC_INTERNAL_URL: http://dex:5556/dex
      LIMEN_OIDC_CLIENT_ID: limen-cli
      LIMEN_BOOTSTRAP_ADMIN_GROUPS: limen-admins
      LIMEN_STATIC_JOIN_TOKENS: "proxy:dev-only-proxy-join-token-7f3a9c1e5b2d4f60,worker:dev-only-worker-join-token-2c8e6a4b0d1f3e5a:pool=dev"
      LIMEN_PROXY_DNS_NAMES: localhost,proxy
      # Every component's audit events end up here (and in S3 and Datadog below).
      LIMEN_AUDIT_FILE: /var/lib/limen/audit/control-plane.jsonl
      LIMEN_AUDIT_S3_BUCKET: limen-audit
      LIMEN_AUDIT_S3_ENDPOINT: http://s3:8333
      LIMEN_AUDIT_S3_PATH_STYLE: "true"
      LIMEN_AUDIT_S3_CREATE_BUCKET: "true"
      LIMEN_AUDIT_S3_FLUSH: 10s
      # The dev identity in s3/s3.json.
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-only-secret
      AWS_REGION: us-east-1
      LIMEN_DATADOG_LOGS_URL: http://fake-datadog:8126/api/v2/logs
      DD_API_KEY: dev-only-datadog-key
      LIMEN_ENVIRONMENT: dev
      # The web console, served by the proxy at https://localhost:3443/console/
      LIMEN_CONSOLE_PUBLIC_URL: https://localhost:3443
      LIMEN_CONSOLE_OIDC_CLIENT_SECRET: dev-only-console-client-secret
      LIMEN_CONSOLE_GRAFANA_URL: http://localhost:3000
    ports: ["127.0.0.1:3081:3081"]
    volumes:
      - cp-ca:/var/lib/limen/ca
      - ca-public:/var/lib/limen/ca-public
      - audit:/var/lib/limen/audit
      - cp-spool:/var/lib/limen/spool
      - recordings:/var/lib/limen/recordings

  proxy:
    build: { <<: *limen-build, target: proxy }
    image: limen-proxy:dev
    restart: unless-stopped
    depends_on: [control-plane]
    environment:
      RUST_LOG: info
      LIMEN_CONTROL_PLANE_ADDR: control-plane:3080
      LIMEN_CONTROL_PLANE_NAME: control-plane
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *proxy-token
      LIMEN_DNS_NAMES: localhost,proxy
      # How other proxies reach this one for peering (ADR-0004).
      LIMEN_PEER_ADDRESS: proxy:3443
      LIMEN_DATA_DIR: /var/lib/limen/proxy
    ports: ["127.0.0.1:3443:3443", "127.0.0.1:3444:3444"]
    volumes:
      - proxy-data:/var/lib/limen/proxy
      - ca-public:/var/lib/limen/ca-public:ro

  worker:
    build: { <<: *limen-build, target: worker }
    image: limen-worker:dev
    restart: unless-stopped
    depends_on: [proxy]
    environment:
      RUST_LOG: info
      LIMEN_PROXY_ADDR: proxy:3443
      LIMEN_PROXY_NAME: proxy
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *worker-token
      LIMEN_DATA_DIR: /var/lib/limen/worker
    volumes:
      - worker-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro

  # An SSH target that trusts only Limen per-session certificates.
  sshd-target:
    build: ./targets/sshd
    image: limen-sshd-target:dev
    restart: unless-stopped
    volumes:
      # ssh-user-ca.pub, exported by the control plane.
      - ca-public:/etc/ssh/limen:ro

  # Trino stands in for Athena: it reads the audit batches in the S3 bucket.
  trino:
    image: trinodb/trino:483
    volumes: ["./trino/catalog:/etc/trino/catalog:ro"]
    depends_on: [s3]

  # Creates the audit table and keeps its partitions in sync.
  trino-init:
    image: trinodb/trino:483
    entrypoint: ["/init/sync.sh"]
    volumes: ["./trino:/init:ro"]
    depends_on: [trino]
    restart: unless-stopped

  # Audit dashboards and alerts: http://localhost:3000 (admin / limen-dev-only).
  grafana:
    image: grafana/grafana:13.0.2
    depends_on: [trino]
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: trino-datasource@1.2.0
      GF_SECURITY_ADMIN_PASSWORD: limen-dev-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/limen/limen-audit.json
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../dashboards/grafana/alerting/trino:/etc/grafana/provisioning/alerting:ro
      - ../../dashboards/grafana/dashboards/trino:/var/lib/grafana/dashboards/limen:ro

volumes:
  postgres: {}
  cp-ca: {}
  ca-public: {}
  audit: {}
  proxy-data: {}
  worker-data: {}
  cp-spool: {}
  s3-data: {}
  recordings: {}
