# Database role bootstrap for the db stack (ADR-0033): the admin login file and
# the one-shot that creates and repairs the limen_* roles. Layered with
# docker-compose.db-targets.yml. Run it after policy is applied:
#   docker compose ... run --rm db-bootstrap --db-bootstrap-once [--db-bootstrap-check]
x-limen-image: &limen-build
  context: ../..
  dockerfile: deploy/docker/Dockerfile

x-dev-tokens:
  worker: &worker-token dev-only-worker-join-token-2c8e6a4b0d1f3e5a

services:
  # Phase 6: the admin login the role bootstrap uses (ADR-0033). Dev only.
  db-secrets-init:
    profiles: ["db"]
    image: alpine:3.22
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 'limen-admin-dev-only' > /s/.admin && mkdir -p /s/postgres /s/mysql &&
        chown -R 65532:65532 /s && chmod 700 /s /s/postgres /s/mysql && chmod 600 /s/.admin
    volumes: [db-secrets:/s]

  # Create and repair the limen_* database roles, then exit.
  #   docker compose --profile db run --rm db-bootstrap [--db-bootstrap-check]
  db-bootstrap:
    profiles: ["tools"]
    build: { <<: *limen-build, target: worker }
    image: limen-worker:dev
    command: ["--db-bootstrap-once"]
    depends_on:
      db-secrets-init: { condition: service_completed_successfully }
      postgres-target: { condition: service_healthy }
      mysql-target: { condition: service_healthy }
    environment:
      RUST_LOG: info
      LIMEN_PROXY_ADDR: proxy:3443
      LIMEN_PROXY_NAME: proxy
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *worker-token
      LIMEN_DATA_DIR: /var/lib/limen/worker
    volumes:
      - bootstrap-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      - db-tls:/var/lib/limen/db-tls:ro
      - db-secrets:/var/lib/limen/db-secrets

volumes:
  db-secrets: {}
  db-tls: {}
  bootstrap-data: {}
