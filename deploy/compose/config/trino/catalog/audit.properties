# Local stand-in for Athena + Glue: Trino's Hive connector reading the audit
# bucket in SeaweedFS. Table metadata lives in a local file metastore and is
# recreated by trino/init.sql on start. Development only.
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore
fs.local.enabled=true
local.location=/tmp
fs.s3.enabled=true
s3.endpoint=http://s3:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=dev
s3.aws-secret-key=dev-only-secret
