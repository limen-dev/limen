# Dex for local development. Stands in for Okta: static users with groups.
# All passwords are "password". Do not use this configuration anywhere real.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

# Branded sign-in page (theme mounted by docker-compose.yml).
frontend:
  dir: /srv/dex/web
  issuer: Limen
  theme: limen
  logoURL: theme/logo.svg

oauth2:
  skipApprovalScreen: true
  responseTypes: [code]

expiry:
  idTokens: 10m

staticClients:
  # Public client: PKCE, and any loopback redirect port (RFC 8252).
  - id: limen-cli
    name: Limen CLI
    public: true

  # The web console: a confidential client (authorization code with PKCE).
  # Its redirect URI is the proxy's public URL. Dev-only secret: the same
  # value is in docker-compose.yml.
  - id: limen-console
    name: Limen console
    secret: dev-only-console-client-secret
    redirectURIs:
      - https://localhost:3443/console/callback
      - https://localhost:3443/console/web/callback

enablePasswordDB: true
staticPasswords:
