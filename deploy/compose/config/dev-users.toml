# The dev stack's users: the one place they are defined. Everything else is
# generated from this file by `python3 deploy/compose/scripts/gen-dev-users.py`:
#   - the staticPasswords block in dex/config.yaml
#   - the user table in README.md
#   - dev-users.sh, which the demo scripts source ($ADMIN, $DEVELOPER, $GUEST)
#   - crates/limen-testkit/src/users.rs, the constants the Rust tests use
# To rename a user, change `id` and `email` here and rerun the generator.
# CI fails if the generated files are stale. Dev only.

# Every dev user's password is "password" (bcrypt).
password_hash = "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"

