# Local database targets for Phase 6 (ADR-0033): PostgreSQL and MySQL with
# TLS from a throwaway CA, seeded with a small `orders` database and a
# `limen_admin` login for the role bootstrap. Development only.
#
# Included by docker-compose.yml and docker-compose.db.yml. All three services
# are in the profile `db`:
#   docker compose --profile db up -d postgres-target mysql-target
services:
  # Throwaway CA and server certificates for the database targets below.
  db-tls:
    profiles: ["db"]
    image: alpine:3.22
    entrypoint: ["/bin/sh", "/gen.sh"]
    volumes:
      - ./targets/tls/gen.sh:/gen.sh:ro
      - db-tls:/tls

  # A PostgreSQL database to reach with `limen db connect` (Phase 6, ADR-0033).
  # Profile "db": docker compose --profile db up -d postgres-target
  # Serves TLS (CA in the db-tls volume) and, for local tests, plain text too.
  postgres-target:
    profiles: ["db"]
    image: postgres:18-alpine
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/pg.crt", "-c", "ssl_key_file=/tls/pg.key", "-c", "hba_file=/etc/limen/pg_hba.conf"]
    environment:
      POSTGRES_PASSWORD: postgres-target-dev-only
    depends_on:
      db-tls: { condition: service_completed_successfully }
    volumes:
      - ./targets/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./targets/postgres/pg_hba.conf:/etc/limen/pg_hba.conf:ro
      - db-tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A MySQL database for `limen db connect` (Phase 6). Serves TLS from the
  # db-tls volume and plain text too.
  mysql-target:
    profiles: ["db"]
    image: mysql:8.4
    command: ["mysqld", "--ssl-ca=/tls/ca.pem", "--ssl-cert=/tls/my.crt", "--ssl-key=/tls/my.key"]
    environment:
      MYSQL_ROOT_PASSWORD: mysql-target-dev-only
    depends_on:
      db-tls: { condition: service_completed_successfully }
    volumes:
      - ./targets/mysql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - db-tls:/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql-target-dev-only --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  db-tls: {}
