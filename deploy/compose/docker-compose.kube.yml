# Kubernetes access on top of the local dev stack (Phase 8, ADR-0038): one more
# worker, in its own pool, that serves the kind cluster `staging`. Used by
# deploy/compose/local-kube.sh:
#
#   docker compose -p limen-kube -f docker-compose.yml -f docker-compose.kube.yml up -d --build
#
# The worker joins kind's Docker network, so it reaches the API server by the
# node's name, which is in the API server's certificate. Dev only.
x-kube-token: &kube-worker-token dev-only-kube-worker-join-token-9d4b7e1a6c3f2058

services:
  # Nothing outside the stack needs these, and their fixed host ports are often
  # taken (Postgres 5432, the S3 store 8333, the Datadog stand-in 8126).
  postgres:
    ports: !reset []
  s3:
    ports: !reset []
  fake-datadog:
    ports: !reset []

  control-plane:
    environment:
      LIMEN_STATIC_JOIN_TOKENS: "proxy:dev-only-proxy-join-token-7f3a9c1e5b2d4f60,worker:dev-only-worker-join-token-2c8e6a4b0d1f3e5a:pool=dev,worker:dev-only-kube-worker-join-token-9d4b7e1a6c3f2058:pool=kube"

  kube-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    image: limen-worker:dev
    restart: unless-stopped
    depends_on: [proxy]
    environment:
      RUST_LOG: info
      LIMEN_PROXY_ADDR: proxy:3443
      LIMEN_PROXY_NAME: proxy
      LIMEN_CA_FILE: /var/lib/limen/ca-public/internal-ca.pem
      LIMEN_JOIN_TOKEN: *kube-worker-token
      LIMEN_DATA_DIR: /var/lib/limen/worker
      LIMEN_KUBE_CLUSTER: staging
      LIMEN_KUBE_API_SERVER: https://${LIMEN_KIND_NODE:?set by local-kube.sh}:6443
      LIMEN_KUBE_CA_FILE: /kube/ca.pem
      LIMEN_KUBE_TOKEN_FILE: /kube/token
    volumes:
      - kube-worker-data:/var/lib/limen/worker
      - ca-public:/var/lib/limen/ca-public:ro
      - ${LIMEN_KUBE_DIR:?set by local-kube.sh}:/kube:ro
    networks: [default, kind]

networks:
  kind:
    external: true

volumes:
  kube-worker-data:
