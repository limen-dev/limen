# Generates the reference part of each module's README.md (inputs, outputs,
# requirements, community modules). Run ./docs.sh; CI runs ./docs.sh --check.
formatter: markdown table

sort:
  enabled: true
  by: required

settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  required: true
  sensitive: true
  type: true

# No Providers section: it prints the version resolved on this machine, which
# differs between machines. Requirements holds the constraints.
content: |-
  {{ .Requirements }}

  {{ .Modules }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->
