# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained and unsound crates are errors, not warnings. To accept one, add
# an `ignore` entry with a reason and a link to the ADR that justifies it.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # rsa (via openidconnect): Marvin timing attack on private-key operations.
    # Limen only verifies IdP RS256 signatures with public keys and never holds
    # an RSA private key. No fixed version exists. See ADR-0012.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private keys" },
    # crypto-bigint 0.5 (via aws-sigv4): timing variability in constant-time
    # operations. Limen uses aws-sigv4 for HMAC request signing only, never its
    # elliptic-curve (SigV4a) path. Fixed in >=0.7.6; drop this when aws-sigv4
    # moves off 0.5. See ADR-0012.
    { id = "RUSTSEC-2026-0387", reason = "aws-sigv4 HMAC signing only; no EC operations on secrets" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses we expect from planned dependencies (rustls, aws-sdk, etc.).
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL is excluded in favor of rustls (ADR-0012).
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
    # Deprecated, unsound, or unmaintained YAML crates (RUSTSEC-2025-0068).
    { crate = "serde_yml", reason = "unsound and unmaintained" },
    { crate = "serde_yaml", reason = "deprecated upstream" },
    { crate = "rustls-pemfile", reason = "unmaintained (RUSTSEC-2025-0134); use rustls-pki-types PEM parsing" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
