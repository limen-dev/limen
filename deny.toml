# cargo-deny configuration. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Unmaintained and unsound crates are errors, not warnings. An `ignore` is a
# last resort: it needs a reason, a row in the ADR-0012 "Accepted advisories"
# table, and an exit condition (the upstream fix that lets us delete it).
# Keep .cargo/audit.toml in sync.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # rsa (via openidconnect): Marvin timing attack on private-key operations.
    # Limen only verifies IdP RS256 signatures with public keys and never holds
    # an RSA private key. Fixed in rsa >= 0.10.0, but openidconnect 4.1.0 pins
    # rsa 0.9. Exit: openidconnect moves to rsa 0.10
    # (https://github.com/ramosbugs/openidconnect-rs/issues/227). See ADR-0012.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private keys" },
    # libsqlite3-sys (via sqlx-sqlite, an optional driver of sqlx): bundled C
    # SQLite CVE. Limen uses sqlx with PostgreSQL only; the SQLite driver is
    # never compiled (`cargo tree -i libsqlite3-sys` is empty), but it is in
    # Cargo.lock, which cargo-audit scans. sqlx-sqlite 0.9.0 requires
    # libsqlite3-sys <0.38 and the fix is 0.39, so no bump is possible until
    # sqlx releases. Exit: a sqlx release whose sqlx-sqlite accepts
    # libsqlite3-sys >= 0.39. See ADR-0012.
    { id = "RUSTSEC-2026-0459", reason = "SQLite driver is never compiled; sqlx-sqlite pins <0.38" },
    # chrono: marked unmaintained (all versions, no fix). It is pulled in by
    # oauth2, openidconnect and russh-util, so it cannot be dropped until those
    # move off it; limen-testkit also uses it directly because
    # IdTokenClaims::new takes chrono types. Unmaintained, not vulnerable.
    # Exit: oauth2 and openidconnect move to jiff
    # (https://github.com/ramosbugs/oauth2-rs/issues/256) and russh-util drops
    # chrono. See ADR-0012.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained; transitive via oauth2/openidconnect/russh-util, no fix" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses we expect from planned dependencies (rustls, aws-sdk, etc.).
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL is excluded in favor of rustls (ADR-0012).
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
    # Deprecated, unsound, or unmaintained YAML crates (RUSTSEC-2025-0068).
    { crate = "serde_yml", reason = "unsound and unmaintained" },
    { crate = "serde_yaml", reason = "deprecated upstream" },
    { crate = "rustls-pemfile", reason = "unmaintained (RUSTSEC-2025-0134); use rustls-pki-types PEM parsing" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
