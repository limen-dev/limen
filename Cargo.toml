[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-rc.2"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Versions verified against crates.io and the RustSec advisory DB on 2026-10-13.
# See docs/adr/0012-dependency-selection.md before adding or replacing an entry.
[workspace.dependencies]
# Internal crates
limen-proto = { path = "crates/limen-proto" }
limen-kube = { path = "crates/limen-kube" }
limen-core = { path = "crates/limen-core" }
limen-policy = { path = "crates/limen-policy" }
limen-ca = { path = "crates/limen-ca" }
limen-audit = { path = "crates/limen-audit" }
limen-tunnel = { path = "crates/limen-tunnel" }
limen-testkit = { path = "crates/limen-testkit" }
limen-component = { path = "crates/limen-component" }
limen-session = { path = "crates/limen-session" }
limen-control-plane = { path = "crates/limen-control-plane" }
limen-proxy = { path = "crates/limen-proxy" }
limen-worker = { path = "crates/limen-worker" }

# Runtime and errors
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "io-std", "time", "sync", "fs"] }
anyhow = "1.0.104"
thiserror = "2.0.21"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
serde-saphyr = "2.0"
uuid = { version = "1.28", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }

# RPC and networking
prost = "0.14.4"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "router", "server", "channel"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-types = "0.14.6"
hyper = { version = "1.12", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "client-legacy", "http1", "http2", "service"] }
http = "1.5"
http-body = "1.0"
http-body-util = "0.1.5"
axum = "0.8.9"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
tower = { version = "0.5.3", features = ["util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
url = "2.5.8"
tokio-stream = { version = "0.1.19", features = ["net"] }
futures = "0.3.34"

# TLS and crypto (aws-lc-rs is the single crypto provider; see ADR-0012)
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1.15", features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["std", "aws-lc-rs"] }
sha2 = "0.11.1"
subtle = "2.6"
rand = "0.10.3"
aws-lc-rs = "1.18"
base64 = "0.23.1"

# AWS
aws-config = { version = "1.12", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "credentials-process", "sso"] }
aws-credential-types = "1.2"
aws-sdk-kms = { version = "1.123", default-features = false, features = ["rt-tokio", "default-https-client"] }

# State
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }

# Identity
openidconnect = { version = "4.1.0", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# SSH
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs"] }
# Exact pin: the release candidate russh 0.64 depends on, so there is one ssh-key in the tree.
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ecdsa", "p256", "ed25519", "rand_core"] }

signature = { version = "3", default-features = false, features = ["alloc"] }

# Rate limiting
governor = "0.10.4"

# Ticket patterns in access requests (ADR-0025). Linear-time matching, no backtracking.
regex-lite = "0.1.9"

# CLI and observability
anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# OTLP trace export over HTTP/protobuf (ADR-0040). Off unless an endpoint is set.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
# internal-logs: export failures show up as tracing warnings instead of being silent.
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "internal-logs"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
webbrowser = "1.2.4"

# MD5 password login, for Redshift only (ADR-0033). Not used for anything else.
md-5 = { version = "0.11", default-features = false }

# SQL targets (ADR-0033). The sqlparser tokenizer only; never for allow or deny.
sqlparser = { version = "0.63", default-features = false }

# Audit pipeline
crc32fast = "1.5.2"
flate2 = "1.1.10"
aws-sdk-s3 = { version = "1.152", default-features = false, features = ["rt-tokio", "default-https-client"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# Testing
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
