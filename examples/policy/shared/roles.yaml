# Example roles for the local dev stack (deploy/compose).
kind: role
version: v1
metadata:
  name: dev-readonly
  description: Read-only access to staging databases, plus SSH as ubuntu on staging hosts.
spec:
  cert_ttl: 10m
  allow:
    - resources: { kind: [postgres, mysql], labels: { env: [staging] } }
      db: { roles: [limen_read] }
    - resources: { kind: [ssh], labels: { env: [staging] } }
      ssh: { logins: [ubuntu] }
    # The server ACL for `read` is the second layer (ADR-0034).
    - resources: { kind: [redis], labels: { env: [staging] } }
      redis: { users: [read], keys: ["app:*"] }
    # The server grants for MongoDB user `read` are the second layer (ADR-0035).
    - resources: { kind: [mongodb], labels: { env: [staging] } }
      mongo: { roles: [read], databases: [orders] }
    # The engine role for `read` is the second layer (ADR-0036).
    - resources: { kind: [elasticsearch, opensearch], labels: { env: [staging] } }
      search: { roles: [read], indices: ["app-*"] }
    # Read orders from the staging brokers (ADR-0037). The brokers' own
    # permissions for consumer are read-only as well.
    - resources: { kind: [rabbitmq], labels: { env: [staging] } }
      mq: { users: [consumer], classes: [read], names: ["orders.*"], vhosts: ["/", "orders"] }
    - resources: { kind: [kafka], labels: { env: [staging] } }
      kafka: { users: [consumer], topics: ["orders.*"], groups: ["dev-*"] }
  deny:
    - resources: { kind: [ssh], labels: { tier: [bastion] } }
---
kind: role
version: v1
metadata:
  name: sre
spec:
  cert_ttl: 30m
  max_session_ttl: 12h
  allow:
    - resources: { kind: [ssh], labels: { "*": ["*"] } }
      ssh: { logins: [ubuntu, ec2-user], port_forwarding: true }
    - resources: { kind: [postgres, mysql, redshift, redis], labels: { "*": ["*"] } }
      db: { roles: [limen_read, limen_write] }
      redis: { users: [write] }
    - resources: { kind: [mongodb], labels: { "*": ["*"] } }
      mongo: { roles: [read, write], databases: ["*"], deny_commands: [dropDatabase] }
    - resources: { kind: [elasticsearch, opensearch], labels: { "*": ["*"] } }
      search: { roles: [read, write], classes: [read, write] }
    - resources: { kind: [rabbitmq], labels: { "*": ["*"] } }
      mq: { users: [consumer, admin], vhosts: ["*"], classes: [read, write, configure] }
    - resources: { kind: [kafka], labels: { "*": ["*"] } }
      kafka: { users: [consumer, admin], classes: [read, write, admin], topics: ["*"] }
    - resources: { kind: [kubernetes], labels: { env: [staging, prod] } }
      kube: { groups: ["limen:edit"] }
---
kind: role
version: v1
metadata:
  name: auditor
  description: Read-only SQL on every environment to check data. No shell access.
spec:
  cert_ttl: 10m
  allow:
    - resources: { kind: [postgres, mysql, redshift], labels: { "*": ["*"] } }
      db: { roles: [limen_read] }
---
kind: role
version: v1
metadata:
  name: viewer
  description: Read-only SQL on staging. Nothing else.
spec:
  cert_ttl: 5m
  allow:
    - resources: { kind: [postgres, mysql], labels: { env: [staging] } }
      db: { roles: [limen_read] }
---
kind: role
version: v1
metadata:
  name: sre-oncall
  description: The on-call SRE. Production SSH and databases, with short certificates and sessions.
spec:
  cert_ttl: 15m
  max_session_ttl: 2h
  allow:
    - resources: { kind: [ssh], labels: { "*": ["*"] } }
      ssh: { logins: [ubuntu, ec2-user] }
    - resources: { kind: [postgres, mysql, redshift], labels: { "*": ["*"] } }
      db: { roles: [limen_read, limen_write] }
  deny:
    - resources: { kind: [ssh], labels: { tier: [bastion] } }
---
kind: role
version: v1
metadata:
  name: contractor
  description: A contractor. One staging host by name, with a very short certificate and session.
spec:
  cert_ttl: 5m
  max_session_ttl: 2h
  allow:
    - resources: { kind: [ssh], labels: { env: [staging] }, names: [web-staging-1] }
      ssh: { logins: [ubuntu] }
