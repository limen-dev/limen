# Examples for integrations and deployment variants (ADR-0018). Some entries
# represent services not yet verified against their real cloud provider; the
# local protocol implementations are available. The addresses are placeholders.
kind: resource
version: v1
metadata: { name: billing-mysql-staging, labels: { env: staging, team: payments } }
spec:
  mysql: { endpoint: "billing.cluster-example.eu-west-1.rds.amazonaws.com:3306", region: eu-west-1 }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata: { name: warehouse-prod, labels: { env: prod, team: data } }
spec:
  redshift: { endpoint: "warehouse.example.eu-west-1.redshift.amazonaws.com:5439", region: eu-west-1 }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata: { name: eks-staging, labels: { env: staging } }
spec:
  # Served today (Phase 8) by a worker started with --kube-cluster=staging, in
  # its own pool so the SSH and database workers are never asked to serve it.
  kubernetes: { cluster_name: staging }
  worker_selector: { pool: kube }
---
kind: resource
version: v1
metadata: { name: orders-mq, labels: { env: prod, team: payments } }
spec:
  rabbitmq: { endpoint: "b-example.mq.eu-west-1.amazonaws.com:5671", region: eu-west-1, aws: true }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata: { name: payments-msk, labels: { env: prod, team: payments } }
spec:
  kafka: { endpoint: "b-1.payments.example.kafka.eu-west-1.amazonaws.com:9098", region: eu-west-1, aws: true }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata: { name: grafana, labels: { env: staging, team: platform } }
spec:
  web:
    address: "grafana.internal.example:443"
    host: grafana.apps.example.com
    tls_ca_file: /etc/ssl/certs/ca-certificates.crt
    health_path: /api/health
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata: { name: legacy-ftp, labels: { env: staging } }
spec:
  tcp: { address: "legacy-ftp:21" }
  worker_selector: { pool: dev }
---
kind: role
version: v1
metadata:
  name: dev-planned
  description: Staging access to the example integrations, for developers.
spec:
  cert_ttl: 10m
  allow:
    - resources: { kind: [mysql, redshift], labels: { env: [staging] } }
      db: { roles: [limen_read] }
    - resources: { kind: [web], labels: { env: [staging] } }
      web: {}
---
kind: role
version: v1
metadata:
  name: sre-planned
  description: Everything the planned integrations will reach, for SRE.
spec:
  cert_ttl: 30m
  max_session_ttl: 12h
  allow:
    - resources: { kind: [mysql, redshift], labels: { "*": ["*"] } }
      db: { roles: [limen_read, limen_write] }
    - resources: { kind: [web], labels: { "*": ["*"] } }
      web: {}
    - resources: { kind: [tcp], labels: { "*": ["*"] } }
      tcp: {}
---
kind: role_mapping
version: v1
metadata:
  name: planned-idp
spec:
  - { idp_group: developers, roles: [dev-planned] }
  - { idp_group: sre, roles: [sre-planned] }
