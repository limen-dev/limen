kind: role
version: v1
metadata: { name: phase12-web }
spec:
  allow:
    - resources: { kind: [web], labels: { env: [phase12] } }
      web: { methods: [GET], path_prefixes: ["/allowed", "/stream", "/ws"] }
---
kind: role_mapping
version: v1
metadata: { name: phase12-web }
spec:
  - { idp_group: developers, roles: [phase12-web] }
---
kind: resource
version: v1
metadata: { name: web-demo, labels: { env: phase12 } }
spec:
  web:
    address: "web-target:8080"
    host: app.apps.test
    insecure_dev: true
    identity_headers: true
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata: { name: web-demo-other, labels: { env: phase12 } }
spec:
  web:
    address: "web-target:8080"
    host: other.apps.test
    insecure_dev: true
    identity_headers: true
  worker_selector: { pool: dev }
