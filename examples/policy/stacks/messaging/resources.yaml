kind: resource
version: v1
metadata:
  name: events-rabbit-staging
  labels: { env: staging, team: platform }
spec:
  # Dev: plain AMQP and a broker user the worker holds. Amazon MQ would be
  # `tls: true` (the default) on port 5671 with `aws: true`.
  rabbitmq: { endpoint: "rabbitmq-target:5672", tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: events-kafka-staging
  labels: { env: staging, team: platform }
spec:
  # Dev: a three-broker cluster, SASL/PLAIN over plain TCP. MSK would be
  # `tls: true` (the default) with `aws: true` and `sasl: aws-msk-iam`.
  kafka: { endpoint: "kafka-1:9092", tls: false, sasl: plain }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: events-kafka-scram
  labels: { env: staging, team: platform }
spec:
  kafka: { endpoint: "kafka-1:9092", tls: false, sasl: scram-sha-512 }
  worker_selector: { pool: dev }
