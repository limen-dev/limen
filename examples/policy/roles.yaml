# Example roles for the local dev stack (deploy/compose).
kind: role
version: v1
metadata:
  name: dev-readonly
  description: Read-only access to staging databases, plus SSH as ubuntu on staging hosts.
spec:
  cert_ttl: 10m
  allow:
    - resources: { kind: [postgres, mysql], labels: { env: [staging] } }
      db: { roles: [limen_readonly] }
    - resources: { kind: [ssh], labels: { env: [staging] } }
      ssh: { logins: [ubuntu] }
    # Read the app's keys on staging caches. The server's own ACL for limen-ro
    # is the second layer (ADR-0034).
    - resources: { kind: [redis], labels: { env: [staging] } }
      redis: { users: [limen-ro], keys: ["app:*"] }
    # Read the orders database on staging MongoDB. The server's own grants for
    # limen-read are the second layer (ADR-0035).
    - resources: { kind: [mongodb], labels: { env: [staging] } }
      mongo: { roles: [limen-read], databases: [orders] }
    # Search the app's indices on staging. The engine's own role for limen-read
    # is the second layer (ADR-0036).
    - resources: { kind: [elasticsearch, opensearch], labels: { env: [staging] } }
      search: { roles: [limen-read], indices: ["app-*"] }
    # Read orders from the staging brokers (ADR-0037). The brokers' own
    # permissions for limen-consumer are read-only as well.
    - resources: { kind: [rabbitmq], labels: { env: [staging] } }
      mq: { users: [limen-consumer], classes: [read], names: ["orders.*"], vhosts: ["/", "orders"] }
    - resources: { kind: [kafka], labels: { env: [staging] } }
      kafka: { users: [limen-consumer], topics: ["orders.*"], groups: ["dev-*"] }
  deny:
    - resources: { kind: [ssh], labels: { tier: [bastion] } }
---
kind: role
version: v1
metadata:
  name: sre
spec:
  cert_ttl: 30m
  max_session_ttl: 12h
  allow:
    - resources: { kind: [ssh], labels: { "*": ["*"] } }
      ssh: { logins: [ubuntu, ec2-user], port_forwarding: true }
    - resources: { kind: [postgres, mysql, redis], labels: { "*": ["*"] } }
      db: { roles: [limen_readonly, limen_rw] }
      redis: { users: [limen-rw] }
    - resources: { kind: [mongodb], labels: { "*": ["*"] } }
      mongo: { roles: [limen-read, limen-rw], databases: ["*"], deny_commands: [dropDatabase] }
    - resources: { kind: [elasticsearch, opensearch], labels: { "*": ["*"] } }
      search: { roles: [limen-read, limen-write], classes: [read, write] }
    - resources: { kind: [rabbitmq], labels: { "*": ["*"] } }
      mq: { users: [limen-consumer, limen-admin], vhosts: ["*"], classes: [read, write, configure] }
    - resources: { kind: [kafka], labels: { "*": ["*"] } }
      kafka: { users: [limen-consumer, limen-admin], classes: [read, write, admin], topics: ["*"] }
    - resources: { kind: [kubernetes], labels: { env: [staging, prod] } }
      kube: { groups: ["limen:edit"] }
