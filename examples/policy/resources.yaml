kind: resource
version: v1
metadata:
  name: orders-staging
  labels: { env: staging, team: payments }
spec:
  postgres: { endpoint: "postgres-target:5432", iam_auth: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: orders-prod
  labels: { env: prod, team: payments }
spec:
  postgres: { endpoint: "orders.cluster-example.eu-west-1.rds.amazonaws.com:5432", region: eu-west-1 }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: web-staging-1
  labels: { env: staging }
spec:
  # The dev sshd target (deploy/compose/targets/sshd). The host key is pinned:
  # the worker refuses to connect if the target presents any other key.
  ssh:
    address: "sshd-target:22"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAkWE808+SBJ5tbkLTrbcpmj4Qg2UvqRG/CYJgBwP1S"
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: bastion-staging
  labels: { env: staging, tier: bastion }
spec:
  ssh: { address: "bastion:22" }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: cache-staging
  labels: { env: staging }
spec:
  redis: { endpoint: "redis-target:6379", iam_auth: false }
  worker_selector: { pool: dev }
