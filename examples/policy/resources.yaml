kind: resource
version: v1
metadata:
  name: orders-staging
  labels: { env: staging, team: payments }
spec:
  # The dev PostgreSQL target (deploy/compose, profile "db"). Secret mode: the
  # worker reads each role's password from <password_dir>/<role>, and verifies
  # the database's certificate against the throwaway CA in the db-tls volume.
  postgres:
    endpoint: "postgres-target:5432"
    iam_auth: false
    default_database: orders
    tls_ca_file: /var/lib/limen/db-tls/ca.pem
    password_dir: /var/lib/limen/db-secrets/postgres
    admin_user: limen_admin
    admin_password_file: /var/lib/limen/db-secrets/.admin
    bootstrap:
      - role: limen_readonly
        grants: [{ database: orders, access: read }]
      - role: limen_rw
        grants: [{ database: orders, access: write }]
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: orders-mysql-staging
  labels: { env: staging, team: payments }
spec:
  # The dev MySQL target, the same way.
  mysql:
    endpoint: "mysql-target:3306"
    iam_auth: false
    default_database: orders
    tls_ca_file: /var/lib/limen/db-tls/ca.pem
    password_dir: /var/lib/limen/db-secrets/mysql
    admin_user: limen_admin
    admin_password_file: /var/lib/limen/db-secrets/.admin
    bootstrap:
      - role: limen_readonly
        grants: [{ database: orders, access: read }]
      - role: limen_rw
        grants: [{ database: orders, access: write }]
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: orders-prod
  labels: { env: prod, team: payments }
spec:
  postgres: { endpoint: "orders.cluster-example.eu-west-1.rds.amazonaws.com:5432", region: eu-west-1 }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: web-staging-1
  labels: { env: staging }
spec:
  # The dev sshd target (deploy/compose/config/targets/sshd). The host key is pinned:
  # the worker refuses to connect if the target presents any other key.
  ssh:
    address: "sshd-target:22"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAkWE808+SBJ5tbkLTrbcpmj4Qg2UvqRG/CYJgBwP1S"
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: bastion-staging
  labels: { env: staging, tier: bastion }
spec:
  ssh: { address: "bastion:22" }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: cache-staging
  labels: { env: staging }
spec:
  # Dev: plain TCP and an ACL password the worker holds. ElastiCache would be
  # `tls: true` (the default) with `iam_auth: true`, `region`, and `cache_name`.
  redis: { endpoint: "redis-target:6379", iam_auth: false, tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: cache-valkey
  labels: { env: staging }
spec:
  # Valkey speaks the same protocol; the dev stack runs one next to Redis.
  redis: { endpoint: "valkey-target:6379", iam_auth: false, tls: false }
  worker_selector: { pool: dev }
