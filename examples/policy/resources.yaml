kind: resource
version: v1
metadata:
  name: orders-staging
  labels: { env: staging, team: payments }
spec:
  # The dev PostgreSQL target (deploy/compose, profile "db"). Secret mode: the
  # worker reads each role's password from <password_dir>/<role>, and verifies
  # the database's certificate against the throwaway CA in the db-tls volume.
  postgres:
    endpoint: "postgres-target:5432"
    iam_auth: false
    default_database: orders
    tls_ca_file: /var/lib/limen/db-tls/ca.pem
    password_dir: /var/lib/limen/db-secrets/postgres
    admin_user: limen_admin
    admin_password_file: /var/lib/limen/db-secrets/.admin
    bootstrap:
      - role: limen_readonly
        grants: [{ database: orders, access: read }]
      - role: limen_rw
        grants: [{ database: orders, access: write }]
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: orders-mysql-staging
  labels: { env: staging, team: payments }
spec:
  # The dev MySQL target, the same way.
  mysql:
    endpoint: "mysql-target:3306"
    iam_auth: false
    default_database: orders
    tls_ca_file: /var/lib/limen/db-tls/ca.pem
    password_dir: /var/lib/limen/db-secrets/mysql
    admin_user: limen_admin
    admin_password_file: /var/lib/limen/db-secrets/.admin
    bootstrap:
      - role: limen_readonly
        grants: [{ database: orders, access: read }]
      - role: limen_rw
        grants: [{ database: orders, access: write }]
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: orders-prod
  labels: { env: prod, team: payments }
spec:
  postgres: { endpoint: "orders.cluster-example.eu-west-1.rds.amazonaws.com:5432", region: eu-west-1 }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: web-staging-1
  labels: { env: staging }
spec:
  # The dev sshd target (deploy/compose/config/targets/sshd). The host key is pinned:
  # the worker refuses to connect if the target presents any other key.
  ssh:
    address: "sshd-target:22"
    host_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFAkWE808+SBJ5tbkLTrbcpmj4Qg2UvqRG/CYJgBwP1S"
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: bastion-staging
  labels: { env: staging, tier: bastion }
spec:
  ssh: { address: "bastion:22" }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: cache-staging
  labels: { env: staging }
spec:
  # Dev: plain TCP and an ACL password the worker holds. ElastiCache would be
  # `tls: true` (the default) with `iam_auth: true`, `region`, and `cache_name`.
  redis: { endpoint: "redis-target:6379", iam_auth: false, tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: cache-valkey
  labels: { env: staging }
spec:
  # Valkey speaks the same protocol; the dev stack runs one next to Redis.
  redis: { endpoint: "valkey-target:6379", iam_auth: false, tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: catalog-staging
  labels: { env: staging, team: catalog }
spec:
  # Dev: SCRAM-SHA-256 with a password the worker holds (one file per role in
  # credentials_dir) and TLS verified against the compose CA. For X.509, set
  # `auth: x509` and put `<role>.pem` (certificate and key) in credentials_dir.
  mongodb:
    endpoint: "mongo-target:27017"
    default_database: orders
    credentials_dir: /etc/limen/mongo/catalog-staging
    tls_ca_file: /etc/limen/mongo/ca.pem
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: events-rabbit-staging
  labels: { env: staging, team: platform }
spec:
  # Dev: plain AMQP and a broker user the worker holds. Amazon MQ would be
  # `tls: true` (the default) on port 5671 with `aws: true`.
  rabbitmq: { endpoint: "rabbitmq-target:5672", tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: catalog-x509
  labels: { env: staging, team: catalog }
spec:
  # The same server, logged in with a client certificate: `<role>.pem`
  # (certificate and key) in credentials_dir. The role name only selects the file.
  mongodb:
    endpoint: "mongo-target:27017"
    auth: x509
    default_database: orders
    credentials_dir: /etc/limen/mongo/x509
    tls_ca_file: /etc/limen/mongo/ca.pem
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: events-kafka-staging
  labels: { env: staging, team: platform }
spec:
  # Dev: a three-broker cluster, SASL/PLAIN over plain TCP. MSK would be
  # `tls: true` (the default) with `aws: true` and `sasl: aws-msk-iam`.
  kafka: { endpoint: "kafka-1:9092", tls: false, sasl: plain }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: catalog-atlas
  labels: { env: prod, team: catalog }
spec:
  # Atlas: list a replica set member (the worker follows the primary); the CA
  # is the system bundle. Unverified against a real Atlas cluster.
  mongodb:
    endpoint: "catalog-shard-00-00.example.mongodb.net:27017"
    flavor: atlas
    auth: x509
    default_database: shop
    credentials_dir: /etc/limen/mongo/catalog-atlas
    tls_ca_file: /etc/ssl/certs/ca-certificates.crt
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: reviews-docdb
  labels: { env: prod, team: catalog }
spec:
  # DocumentDB: TLS with the AWS global bundle and IAM (`MONGODB-AWS`). The
  # worker's IAM identity is the login. Unverified against a real cluster.
  mongodb:
    endpoint: "reviews.cluster-example.eu-west-1.docdb.amazonaws.com:27017"
    flavor: documentdb
    auth: aws
    default_database: reviews
    tls_ca_file: /etc/limen/mongo/global-bundle.pem
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: search-staging
  labels: { env: staging }
spec:
  # Dev: plain HTTP and a password the worker holds (--search-credentials-file).
  # Elastic Cloud would be `tls: true` (the default) with an `api_key`.
  elasticsearch: { endpoint: "elasticsearch-target:9200", tls: false }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: search-opensearch
  labels: { env: staging }
spec:
  # OpenSearch speaks the same REST API; the dev stack runs one next to
  # Elasticsearch, reached over TLS (its demo certificate carries this name)
  # and verified against the worker's --search-ca-file.
  opensearch: { endpoint: "node-0.example.com:9200" }
  worker_selector: { pool: dev }
---
kind: resource
version: v1
metadata:
  name: logs-opensearch
  labels: { env: prod, team: platform }
spec:
  # Amazon OpenSearch Service: requests are signed with SigV4 using the
  # worker's AWS credentials. Unverified against the real service (ADR-0036).
  opensearch:
    endpoint: "search-logs-example.eu-west-1.es.amazonaws.com:443"
    region: eu-west-1
    aws: true
    audit: { redact_ids: true }
  worker_selector: { pool: prod }
---
kind: resource
version: v1
metadata:
  name: events-kafka-scram
  labels: { env: staging, team: platform }
spec:
  kafka: { endpoint: "kafka-1:9092", tls: false, sasl: scram-sha-512 }
  worker_selector: { pool: dev }
