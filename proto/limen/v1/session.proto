syntax = "proto3";

package limen.v1;

// A payload signed by a Limen component. The signature covers a
// domain-separation label plus the payload, so a signed grant can never be
// replayed as a policy snapshot and vice versa.
message Signed {
  bytes payload = 1;
  // DER ECDSA P-256 / SHA-256 signature.
  bytes signature = 2;
  // DER certificate of the signer, issued by the internal CA.
  bytes signer_cert_der = 3;
}

// What a proxy authorized (ADR-0002). Signed by the proxy, verified by the
// worker and, for SSH certificates, by the control plane.
message SessionGrant {
  string session_id = 1;
  string username = 2;
  repeated string roles = 3;
  string login_id = 4;
  string resource = 5;
  // "ssh", "postgres", ...
  string kind = 6;
  // The upstream identity: Unix login, DB role, ...
  string principal = 7;
  int64 issued_at_unix = 8;
  // The session must be established before this.
  int64 establish_by_unix = 9;
  // The session must end by this (max_session_ttl).
  int64 session_expires_at_unix = 10;
  // Random. Workers refuse a nonce they've seen.
  bytes nonce = 11;
  // The user's certificate, so the worker can re-verify identity and roles.
  bytes user_cert_der = 12;
  string proxy_id = 13;
  string worker_id = 14;
  // The database the session may use (SQL kinds). Empty for other kinds.
  string database = 15;
  // Kubernetes only: every group the policy lets the user assume on this
  // cluster. The worker impersonates the user with exactly these groups.
  repeated string groups = 16;
}

// The policy as of `issued_at` (ADR-0008). Proxies and workers use it for up
// to the grace period after issue when the control plane is unreachable (ADR-0011).
message PolicySnapshot {
  int64 version = 1;
  int64 issued_at_unix = 2;
  // JSON array of policy documents.
  string documents_json = 3;
  // Users an admin has locked. They get no new sessions, and open ones end.
  repeated string locked_users = 4;
  // Sessions an admin ended. Kept for a day, longer than any session lives.
  repeated string killed_sessions = 5;
  // Proxies and workers an admin revoked. Their certificates are no longer honoured.
  repeated string revoked_components = 6;
  // Logins (the id in a user certificate) that were ended by `limen logout`.
  // Kept for a day, longer than any certificate lives.
  repeated string revoked_logins = 7;
}

// First message on a client session stream (ALPN limen-ssh/1 and friends),
// length-prefixed (u32 big-endian). Answered by SessionResponse, then the
// stream carries the protocol bytes.
message SessionRequest {
  string resource = 1;
  string principal = 2;
  // SQL sessions: the database to use. Empty means the resource's default.
  string database = 3;
  // Sessions opened by one client run (one `limen mongo connect`) share this
  // id, so the console can show them as one. Optional; at most 64 of [A-Za-z0-9-].
  string group = 4;
}

message SessionResponse {
  bool ok = 1;
  string error = 2;
  string session_id = 3;
}

// Served by the control plane. Proxies call it directly, workers through a proxy.
service PolicySync {
  rpc GetPolicySnapshot(GetPolicySnapshotRequest) returns (Signed);
}

message GetPolicySnapshotRequest {}

// Served by the control plane. Workers call it through a proxy.
service SshCertificates {
  // Per-session certificates for a granted SSH session: a user certificate
  // for the target and a host certificate for the worker.
  rpc IssueSessionCertificates(IssueSessionCertificatesRequest) returns (IssueSessionCertificatesResponse);
}

message IssueSessionCertificatesRequest {
  Signed grant = 1;
  // OpenSSH public keys, generated by the worker for this session only.
  string user_public_key = 2;
  string host_public_key = 3;
}

message IssueSessionCertificatesResponse {
  string user_certificate = 1;
  string host_certificate = 2;
}
