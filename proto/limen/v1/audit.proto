syntax = "proto3";

package limen.v1;

// Served by the control plane. Proxies call it directly, workers through a
// proxy (ADR-0009). The control plane acks only once the events are durable
// in its own spool; senders retry until acked, so delivery is at-least-once.
service AuditIngest {
  rpc Ingest(IngestRequest) returns (IngestResponse);
  // A finished session recording. The first chunk names the session; the
  // last carries the SHA-256 of the whole file.
  rpc UploadRecording(stream RecordingChunk) returns (UploadRecordingResponse);
}

message IngestRequest {
  // JSON-encoded audit events (limen_audit::Event), as written to the
  // sender's spool. Their producer must be the calling component.
  repeated bytes events = 1;
}

message IngestResponse {
  uint32 accepted = 1;
}

message RecordingChunk {
  string session_id = 1;
  bytes data = 2;
  string sha256 = 3;
}

message UploadRecordingResponse {
  string uri = 1;
}

// Served by the control plane, called only by a peer control plane (a live
// replica in the registry). An ephemeral replica that is shutting down hands
// the audit records its sinks have not shipped to a peer, which appends them
// to its own spool. Events keep their event_id, so a batch sent twice (the
// receiver died before acking) is removed downstream by the same idempotency
// key the sinks already use.
service AuditHandoff {
  rpc Handoff(stream HandoffBatch) returns (stream HandoffAck);
}

message HandoffBatch {
  // JSON-encoded audit events (limen_audit::Event), from any producer.
  repeated bytes events = 1;
  // The sender's spool index of the last event in this batch.
  uint64 last_index = 2;
}

// Sent once per batch, after the batch is durable in the receiver's spool.
message HandoffAck {
  // The batch's last_index: everything up to and including it is durable.
  uint64 durable_upto = 1;
}
