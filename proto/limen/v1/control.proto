syntax = "proto3";

package limen.v1;

import "limen/v1/session.proto";

// Control plane API. Proxies call it directly over mTLS. The CLI and workers
// reach it through a proxy, which forwards their verified client
// certificate. The control plane re-verifies that certificate (design §3).

// Unauthenticated login, plus identity introspection.
service Auth {
  // OIDC settings the CLI needs to start a login. Unauthenticated.
  rpc GetAuthConfig(GetAuthConfigRequest) returns (GetAuthConfigResponse);
  // Exchanges an IdP ID token and a CSR for short-lived credentials. Unauthenticated.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Exchanges a CI platform's workload identity token and a CSR for the
  // short-lived credentials of a bot (ADR-0019). Unauthenticated.
  rpc BotLogin(BotLoginRequest) returns (LoginResponse);
  // Identity and roles of the calling user certificate.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Ends the calling certificate's login: proxies and workers refuse it from
  // then on, within one policy refresh. Idempotent.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Atomically consumes a one-use browser SSO handoff. Direct proxy mTLS only.
  rpc RedeemWebHandoff(RedeemWebHandoffRequest) returns (RedeemWebHandoffResponse);
}

service Resources {
  // Resources the calling user can access, with the principals they may use.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse);
}

// Just-in-time access (ADR-0025) and the questions around it (ADR-0028). Any
// signed-in user may call these; what each call allows depends on the policy
// and the caller. Approval only ever happens here, inside an authenticated
// Limen session.
service Access {
  // Ask for a requestable role on one resource. A break-glass role is granted
  // at once.
  rpc RequestAccess(RequestAccessRequest) returns (AccessRequestInfo);
  rpc ListAccessRequests(ListAccessRequestsRequest) returns (ListAccessRequestsResponse);
  // Approve or deny a pending request. Never your own.
  rpc DecideAccessRequest(DecideAccessRequestRequest) returns (AccessRequestInfo);
  // The requester withdraws a pending request.
  rpc CancelAccessRequest(CancelAccessRequestRequest) returns (AccessRequestInfo);
  // Admin: active grants, and ending one (which ends the sessions it allowed).
  rpc ListAccessGrants(ListAccessGrantsRequest) returns (ListAccessGrantsResponse);
  rpc RevokeAccessGrant(RevokeAccessGrantRequest) returns (RevokeAccessGrantResponse);
  // Why the caller can or cannot reach a resource. Admins may ask about anyone.
  rpc Explain(ExplainRequest) returns (ExplainResponse);
}

// Requires the limen:admin role.
service Admin {
  rpc ApplyPolicy(ApplyPolicyRequest) returns (ApplyPolicyResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  // The active policy's documents, for `limen policy who-can|what-can|diff`.
  rpc GetPolicyDocuments(GetPolicyDocumentsRequest) returns (GetPolicyDocumentsResponse);
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc ListComponents(ListComponentsRequest) returns (ListComponentsResponse);
  // Refuse a user's logins and sessions and end their open sessions.
  rpc LockUser(LockUserRequest) returns (LockUserResponse);
  rpc UnlockUser(UnlockUserRequest) returns (UnlockUserResponse);
  rpc ListLocks(ListLocksRequest) returns (ListLocksResponse);
  // End one live session.
  rpc KillSession(KillSessionRequest) returns (KillSessionResponse);
  // Stop honouring a proxy's or worker's certificate and refuse its renewal.
  rpc RevokeComponent(RevokeComponentRequest) returns (RevokeComponentResponse);
}

service Enrollment {
  // Exchanges a join token and a CSR for a component certificate. Unauthenticated.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // Renews the calling component's certificate.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
}

// Called by proxies only.
service Registry {
  // Full set of worker tunnels the calling proxy holds. Replaces its previous report.
  rpc ReportTunnels(ReportTunnelsRequest) returns (ReportTunnelsResponse);
  // Live tunnels held by other proxies, for proxy peering (ADR-0004).
  rpc ListTunnels(ListTunnelsRequest) returns (ListTunnelsResponse);
}

message GetAuthConfigRequest {}

message GetAuthConfigResponse {
  string issuer_url = 1;
  string client_id = 2;
  repeated string scopes = 3;
  string server_version = 4;
  // The `aud` a bot's workload identity token must carry.
  string bot_audience = 5;
}

enum LoginFlow {
  LOGIN_FLOW_UNSPECIFIED = 0;
  // Authorization code with PKCE. The ID token nonce must bind the CSR key.
  LOGIN_FLOW_PKCE = 1;
  // Device authorization grant. No nonce binding is possible (threat model, TB0).
  LOGIN_FLOW_DEVICE = 2;
}

message LoginRequest {
  string id_token = 1;
  // DER PKCS#10 CSR for the user's X.509 key.
  bytes csr_der = 2;
  // nonce = base64url(SHA-256(CSR SubjectPublicKeyInfo DER || nonce_salt)).
  bytes nonce_salt = 3;
  LoginFlow flow = 4;
}

message BotLoginRequest {
  // github_actions, gitlab, or oidc.
  string method = 1;
  // The workload identity token (a JWT) minted for this job.
  string token = 2;
  // DER PKCS#10 CSR for the bot's X.509 key.
  bytes csr_der = 3;
  // Optional: which bot the token is for, when more than one could match.
  string bot = 4;
}

message LoginResponse {
  string username = 1;
  repeated string roles = 2;
  string login_id = 3;
  string cert_pem = 4;
  string user_ca_pem = 5;
  string internal_ca_pem = 6;
  int64 expires_at_unix = 7;
  // OpenSSH public key of the SSH host CA, for the CLI's known_hosts.
  string ssh_host_ca_public_key = 8;
}

message LogoutRequest {}

message LogoutResponse {
  // The login that was ended.
  string login_id = 1;
  // False if it had already been ended.
  bool revoked = 2;
}

message RedeemWebHandoffRequest {
  string token = 1;
  string resource = 2;
  string host = 3;
  string browser_nonce = 4;
}

message RedeemWebHandoffResponse {
  Signed session = 1;
  string return_path = 2;
}

// Signed by the control plane; the proxy binds it to the host-only app cookie.
message WebAppSession {
  string username = 1;
  repeated string roles = 2;
  string login_id = 3;
  string resource = 4;
  string host = 5;
  int64 expires_at_unix = 6;
  bytes user_cert_der = 7;
  reserved 8;
  string identity_assertion = 9;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string username = 1;
  repeated string roles = 2;
  string login_id = 3;
  int64 expires_at_unix = 4;
}

message ListResourcesRequest {}

message Resource {
  string name = 1;
  string kind = 2;
  map<string, string> labels = 3;
  repeated string principals = 4;
  // SQL resources: the database used when the user names none. Empty if there is none.
  string default_database = 5;
  // Browser URL for an authorized web app. Empty for other resources or if
  // browser SSO is not configured.
  string web_url = 6;
  // When the access ends, if the user reaches this resource only through an
  // approved access request (ADR-0025). 0 for standing access.
  int64 grant_expires_at_unix = 7;
}

message ListResourcesResponse {
  repeated Resource resources = 1;
  int64 policy_version = 2;
  // Resources the user could get by asking (ADR-0025): a hint with no address.
  repeated RequestableResource requestable = 3;
}

message RequestableResource {
  string name = 1;
  string kind = 2;
  map<string, string> labels = 3;
  // The requestable roles that would grant it.
  repeated string roles = 4;
}

message PolicySource {
  string name = 1;
  string content = 2;
}

message ApplyPolicyRequest {
  repeated PolicySource sources = 1;
  bool dry_run = 2;
  // Optional reference to where the policy came from, such as a Git commit SHA.
  string source_ref = 3;
  // Refuse to apply unless the policy's `policy_test` documents all pass
  // (and there is at least one).
  bool require_tests = 4;
}

message PolicyDiff {
  repeated string added = 1;
  repeated string removed = 2;
  repeated string changed = 3;
}

message ApplyPolicyResponse {
  PolicyDiff diff = 1;
  // Version now active. Unchanged when dry_run is set or nothing changed.
  int64 version = 2;
  string digest = 3;
  bool applied = 4;
  // Who gains or loses access to what, one line each (ADR-0028).
  repeated string access_changes = 5;
  // Valid, but probably not what was meant.
  repeated string warnings = 6;
  // Results of the `policy_test` documents in the new policy.
  repeated PolicyTestResult test_results = 7;
}

message PolicyTestResult {
  string test = 1;
  uint32 case_number = 2;
  string name = 3;
  bool passed = 4;
  string expected = 5;
  string got = 6;
  string detail = 7;
}

message GetPolicyDocumentsRequest {}

message GetPolicyDocumentsResponse {
  int64 version = 1;
  // JSON array of policy documents, as in a policy snapshot.
  string documents_json = 2;
}

message GetPolicyRequest {}

message GetPolicyResponse {
  int64 version = 1;
  string digest = 2;
  string author = 3;
  int64 created_at_unix = 4;
  uint32 resource_count = 5;
}

message CreateJoinTokenRequest {
  // "proxy" or "worker".
  string kind = 1;
  uint32 ttl_seconds = 2;
  map<string, string> labels = 3;
  // DNS names or IPs the enrolled component may put in its certificate.
  repeated string dns_names = 4;
  // Optional: the name the enrolled component may have, exactly, or a
  // pattern with one `*` matching zero or more of [a-z0-9-]. An exact name
  // is given to the component even if it asks for none.
  string name = 5;
}

message CreateJoinTokenResponse {
  string token = 1;
  int64 expires_at_unix = 2;
}

message ListComponentsRequest {}

message TunnelInfo {
  string proxy_id = 1;
  string tunnel_id = 2;
  int64 lease_expires_at_unix = 3;
  // The proxy's name, if it has one.
  string proxy_name = 4;
}

message Component {
  string id = 1;
  string kind = 2;
  map<string, string> labels = 3;
  int64 enrolled_at_unix = 4;
  int64 last_seen_at_unix = 5;
  int64 cert_expires_at_unix = 6;
  repeated TunnelInfo tunnels = 7;
  // Display name approved at enrollment, if any. Empty: none. The id stays
  // the identity.
  string name = 8;
}

message ListComponentsResponse {
  repeated Component components = 1;
}

message EnrollRequest {
  string join_token = 1;
  bytes csr_der = 2;
  // "proxy" or "worker". Must match the token.
  string kind = 3;
  // Must be a subset of the names the token allows.
  repeated string dns_names = 4;
  // Optional display name. Must be approved by the token. Empty: none (or
  // the token's exact name, if it has one).
  string name = 5;
}

message EnrollResponse {
  string component_id = 1;
  string cert_pem = 2;
  string internal_ca_pem = 3;
  string user_ca_pem = 4;
  int64 expires_at_unix = 5;
  map<string, string> labels = 6;
  // The name the component was given. Empty: none.
  string name = 7;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  string cert_pem = 1;
  int64 expires_at_unix = 2;
}

message TunnelReport {
  string worker_id = 1;
  string tunnel_id = 2;
  // The reporting proxy's view of the worker's load (its last ping plus the
  // sessions this proxy opened since). 0/0: unknown, no cap.
  uint32 active_sessions = 3;
  uint32 max_sessions = 4;
}

message ReportTunnelsRequest {
  repeated TunnelReport tunnels = 1;
  // Private address other proxies use to reach this one (proxy peering, ADR-0004).
  string peer_address = 2;
}

message ReportTunnelsResponse {
  uint32 lease_seconds = 1;
}

message ListTunnelsRequest {}

message PeerTunnel {
  string worker_id = 1;
  map<string, string> worker_labels = 2;
  string proxy_id = 3;
  // Where to reach the proxy holding the tunnel (its --peer-address).
  string peer_address = 4;
  // The worker's load as that proxy last reported it. 0/0: unknown, no cap.
  uint32 active_sessions = 5;
  uint32 max_sessions = 6;
  // Display names, if any. Empty: none.
  string worker_name = 7;
  string proxy_name = 8;
}

message ListTunnelsResponse {
  repeated PeerTunnel tunnels = 1;
}

message LockUserRequest {
  string username = 1;
  string reason = 2;
}

message LockUserResponse {
  // False if the user was already locked.
  bool locked = 1;
}

message UnlockUserRequest {
  string username = 1;
}

message UnlockUserResponse {
  // False if the user wasn't locked.
  bool unlocked = 1;
}

message ListLocksRequest {}

message Lock {
  string username = 1;
  string reason = 2;
  string locked_by = 3;
  int64 locked_at_unix = 4;
}

message ListLocksResponse {
  repeated Lock locks = 1;
}

message KillSessionRequest {
  string session_id = 1;
  string reason = 2;
}

message RevokeComponentRequest {
  string component_id = 1;
  string reason = 2;
}

message RevokeComponentResponse {
  // False if it was already revoked.
  bool revoked = 1;
}

message KillSessionResponse {
  // False if it was already marked for ending.
  bool killed = 1;
}

message RequestAccessRequest {
  string resource = 1;
  // Which requestable role, when more than one reaches the resource.
  string role = 2;
  uint32 duration_seconds = 3;
  string reason = 4;
  // Select a break-glass role: granted at once, reviewed after.
  bool break_glass = 5;
}

message AccessApproval {
  string approver = 1;
  // "approve" or "deny".
  string decision = 2;
  string comment = 3;
  int64 decided_at_unix = 4;
}

message AccessRequestInfo {
  string id = 1;
  string requester = 2;
  string role = 3;
  string resource = 4;
  string reason = 5;
  uint32 duration_seconds = 6;
  // pending, approved, denied, expired, cancelled, or revoked.
  string status = 7;
  bool break_glass = 8;
  uint32 approvals_required = 9;
  repeated AccessApproval approvals = 10;
  int64 created_at_unix = 11;
  // A pending request lapses at this time.
  int64 expires_at_unix = 12;
  // When the grant ends, once approved. 0 before.
  int64 grant_expires_at_unix = 13;
  // True when the caller may approve or deny it now.
  bool can_decide = 14;
  // What the requester did on this resource in the past 30 days: the context
  // an approver needs.
  uint32 requester_sessions_30d = 15;
  int64 requester_last_session_unix = 16;
}

message ListAccessRequestsRequest {
  // "mine" (default), "approvable" (pending, and the caller may decide), or
  // "all" (admins and auditors).
  string scope = 1;
  // Optional status filter.
  string status = 2;
  uint32 limit = 3;
}

message ListAccessRequestsResponse {
  repeated AccessRequestInfo requests = 1;
}

message DecideAccessRequestRequest {
  string id = 1;
  bool approve = 2;
  string comment = 3;
}

message CancelAccessRequestRequest {
  string id = 1;
}

message AccessGrantInfo {
  string request_id = 1;
  string username = 2;
  string role = 3;
  string resource = 4;
  string reason = 5;
  bool break_glass = 6;
  int64 granted_at_unix = 7;
  int64 expires_at_unix = 8;
  repeated string approvers = 9;
}

message ListAccessGrantsRequest {
  // Include ended grants from the last 30 days.
  bool include_ended = 1;
}

message ListAccessGrantsResponse {
  repeated AccessGrantInfo grants = 1;
}

message RevokeAccessGrantRequest {
  string request_id = 1;
  string reason = 2;
}

message RevokeAccessGrantResponse {
  // False if it had already ended.
  bool revoked = 1;
  // Sessions ended with it.
  uint32 sessions_ended = 2;
}

message ExplainRequest {
  string resource = 1;
  // The principal to check, as `kind=value` (login=ubuntu, db_role=limen_read,
  // ...). Optional: without one, explains the resource as a whole.
  string principal = 2;
  // The database for `db_role` and `mongo_role`.
  string database = 3;
  // Admin only: explain for this user instead of the caller, with the full trace.
  string user = 4;
}

message ExplainResponse {
  repeated string lines = 1;
  // Whether the answer is the full trace (admin) or the user-safe one.
  bool full_trace = 2;
}
