syntax = "proto3";

package limen.v1;

// Served by the WORKER over the connection the worker dialed to a proxy.
// The proxy is the gRPC client. See docs/adr/0003-reverse-tunnel.md.
service WorkerTunnel {
  // Opens one session stream. The first client frame must be `open`.
  rpc OpenSession(stream TunnelFrame) returns (stream TunnelFrame);
  // Lets the proxy check that the tunnel is alive.
  rpc Ping(PingRequest) returns (PingResponse);
}

message TunnelFrame {
  oneof frame {
    SessionOpen open = 1;
    bytes data = 2;
    SessionClose close = 3;
  }
}

message SessionOpen {
  // Session grant signed by the proxy. The worker verifies it before serving.
  bytes signed_grant = 1;
}

message SessionClose {
  string reason = 1;
}

message PingRequest {}

message PingResponse {
  string worker_id = 1;
  bool draining = 2;
}
