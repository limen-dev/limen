syntax = "proto3";

package limen.v1;

import "limen/v1/session.proto";

// Served by the WORKER over the connection the worker dialed to a proxy.
// The proxy is the gRPC client. See docs/adr/0003-reverse-tunnel.md.
service WorkerTunnel {
  // Opens one session stream. The first client frame must be `open`.
  rpc OpenSession(stream TunnelFrame) returns (stream TunnelFrame);
  // Lets the proxy check that the tunnel is alive.
  rpc Ping(PingRequest) returns (PingResponse);
}

message TunnelFrame {
  oneof frame {
    // Proxy → worker, first frame.
    SessionOpen open = 1;
    bytes data = 2;
    SessionClose close = 3;
    // Worker → proxy, first frame: the worker accepted the grant.
    SessionOpened opened = 4;
  }
}

message SessionOpen {
  // Session grant signed by the proxy. The worker verifies it before serving.
  Signed grant = 1;
  // W3C `traceparent` of the proxy's session span, empty when tracing is off.
  // Only a parent link for the worker's span: never trusted for anything else.
  string traceparent = 2;
}

message SessionOpened {}

message SessionClose {
  string reason = 1;
  // Where the worker stored the session recording, if any, and its SHA-256.
  string recording_uri = 2;
  string recording_sha256 = 3;
}

message PingRequest {}

message PingResponse {
  string worker_id = 1;
  bool draining = 2;
  // Sessions the worker holds now (admitted or being admitted), and its cap.
  // Workers before Phase 5 send neither: 0/0 reads as "load unknown, no cap".
  // max_sessions 0 also means the worker has no cap.
  uint32 active_sessions = 3;
  uint32 max_sessions = 4;
}
